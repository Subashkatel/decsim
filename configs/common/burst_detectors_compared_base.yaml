# The shared base of the burst detector comparison
# (docs/how-to/compare_burst_detectors.md). Every file of
# configs/burst_detectors_compared/ extends this one and changes only
# its burst_detector section, or its burst for the quiet runs, so any
# difference between two files' rows is the detector's or the burst's.
# It names no detector, so it is not a comparison itself. Every key is
# documented in reference.yaml.
#
# The burst is the burst study's middle radiation burst at d = 5 over a
# background of p = 3e-3: 15 qubits (radius 3.1), amplitude 0.01,
# decaying over 600 rounds. It starts at round 50 of 400, so a flag up
# to burst_detector.catch_deadline_rounds (300) after it lands inside
# the shot.

extends: ../seam_pinned_switching.yaml

qpu:
  kind: burst_stim
  burst_onset_round: 50
  burst_decay_rounds: 600.0
  burst_radius: 3.1
  burst_error_probability: 0.01

workload:
  kind: producer
  function: decsim.producers:memory_circuit
  arguments:
    code_task: surface_code:rotated_memory_z
    rounds_per_shot: 400

sweep:
  - physical_error_probability: [0.003]
    distance: [5]
    round_period_microseconds: [1.0]
    shots: 20
