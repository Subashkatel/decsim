# Four burst detectors, each on quiet shots and on one burst
# (docs/how-to/compare_burst_detectors.md). The detector and the burst
# are the grid's only axes, so a difference between two rows is the
# detector's or the burst's. On quiet shots every flag is a false alarm.
#
# The burst is a radiation-like burst at d = 5 over a background of
# p = 3e-3: about 15 qubits (radius 3.1), amplitude 0.01, decaying over
# 600 rounds. It starts at round 50 of 400, so a flag up to
# burst_detector.catch_deadline_rounds (300) after it lands inside the
# shot.
#
# The machine is the seam-pinned switching point: weak pymatching with
# the complementary gap, escalating to belief matching below the
# paper's 20 dB threshold (Toshio 2510.25222 Sec. IV), the escalated
# window's near face pinned on its neighbour's committed correction
# (Bombin 2303.04846 lines 775-788), so a flagged window meets the
# strong decoder. Every key is documented in reference.yaml.

extends: ../../bases/weak_decoder_baseline.yaml

escalation:
  kind: switching
  gap_threshold_db: 20.0
  strong_window: near_seam_pinned

links:
  qpu_to_controller:  {latency_cycles: 1, clock: fridge, bits_per_cycle: null}
  controller_to_weak_buffer: {latency_cycles: 1, clock: fridge, bits_per_cycle: null}
  controller_to_strong_buffer: {latency_cycles: 1, clock: room, bits_per_cycle: null}
  weak_buffer_to_weak_decoder: {latency_cycles: 1, clock: fridge, bits_per_cycle: null}
  weak_decoder_to_strong_decoder: {latency_cycles: 1, clock: room, bits_per_cycle: null}
  strong_buffer_to_strong_decoder: {latency_cycles: 1, clock: room, bits_per_cycle: null}
  decoder_to_decoder:  {latency_cycles: 1, clock: fridge, bits_per_cycle: null}
  weak_decoder_to_frame: {latency_cycles: 1, clock: fridge, bits_per_cycle: null}
  strong_decoder_to_frame:  {latency_cycles: 1, clock: room, bits_per_cycle: null}
  frame_to_controller:  {latency_cycles: 1, clock: fridge, bits_per_cycle: null}
  controller_to_qpu:  {latency_cycles: 1, clock: fridge, bits_per_cycle: null}

weak_decoder:
  kind: pymatching
  units: 1
  unit_memory:
    bits: null
  engine:
    clock: fridge
    fetch_cycles_per_round: 1
    fetch_cycles_per_job: 0
    release_cycles_per_job: 10
    release_cycles_per_round: 0
strong_decoder:
  kind: belief_matching
  units: 1
  unit_memory:
    bits: null
  engine:
    clock: room
    fetch_cycles_per_round: 1
    fetch_cycles_per_job: 0
    release_cycles_per_job: 10
    release_cycles_per_round: 0

workload:
  kind: producer
  function: decsim.producers:memory_circuit
  arguments:
    code_task: surface_code:rotated_memory_z
    rounds_per_shot: 400
    distance: ${qpu.distance}

sweep:
  - axes:
      burst_detector:
        - kind: event_count             # the patch's detection events over a window, and each position's
        - kind: masked_regional_cusum   # one CUSUM bank on the whole patch, no mask
          mask_count: null
          region_radii: []
        - kind: masked_regional_cusum   # CUSUMs on discs around each check and the whole patch, no mask
          mask_count: null
        - kind: masked_regional_cusum   # the same with defect-like checks masked, at its defaults
      qpu:
        - kind: stim_device             # quiet shots, the burst off
        - kind: burst_stim
          burst_onset_round: 50
          burst_decay_rounds: 600.0
          burst_radius: 3.1
          burst_error_probability: 0.01
      workload.arguments.physical_error_probability: [0.003]
      qpu.distance: [5]
      qpu.round_period_microseconds: [1.0]
    collection: {max_shots: 20}
