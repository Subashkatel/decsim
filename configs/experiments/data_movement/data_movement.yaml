# The data-movement study: the copies, references and moves of the data
# path, read against what the sources say each hop does. Its four
# blocks differ in one setting each and in nothing else.
#
# Block 1 is the tree's own behaviour, and the research note's
# defaults: the weak unit is given a copy of the rounds it decodes
# (docs/rewrite/notes/data_movement_research.md section 5,
# `decoders.<tier>.input` copy, from AFS 2001.06598 lines 520-535 and
# Collision Clustering 2309.05558 lines 268-272), and the window's
# boundary mask is XORed into a duplicate of that copy (the same
# table's `boundary_fold`, cuda-q QEC's sliding_window.cpp:287-293).
#
# Block 2 reads the input in place: the rounds stay where the weak
# syndrome buffer keeps them, so the tier's input link moves nothing,
# the unit deposits nothing, and the store's hold stays for the whole
# decode. That is the software decoder on the controller host, which
# Google runs: the detections are "streamed to the real-time decoding
# software via a shared memory buffer" and the decoder threads read
# them "as it is streamed in" (2408.13687 lines 476-477, 487-489).
#
# Block 3 folds the boundary in place: the mask is XORed into the
# unit's own copy of the rounds, so the masked view is never made. That
# is the hardware decoder, which writes its on-chip storage directly:
# AFS's processing elements "can directly access the data stored
# on-chip" (2001.06598 lines 528-531) and Helios keeps its shared memory
# single-writer in registers (2301.08419 lines 632-640). Input in place
# with fold in place is no block: the load refuses it, because folding
# into the unit's memory needs the unit's own copy of the rounds
# (reference.yaml's boundary_fold, windows/decode_requests.py).
#
# Block 4 escalates, which opens the last hops of data_path.md's table:
# hop 8, the weak result to the escalation, a verdict and no data
# (Toshio 2510.25222 lines 605-622, the discarded weak outcome), and hop
# 9, the strong syndrome buffer to the strong decoder, the assigned
# region copied over a link, "processed all at once, after the boundary
# conditions at both ends have been determined" (2510.25222 lines
# 1248-1250) and a PCIe or network traversal on a separate host (Chen
# 2605.30765 lines 1609-1611). It also opens the controller's second
# write, hop 4, since the strong syndrome buffer is written in
# parallel. The strong tier's own `input` stays copy, the research
# note's default on this row; in_place there is the GPU-visible buffer,
# which no decoder row models yet.
#
# Both tiers are priced cards so the study is deterministic: a card
# prices the algorithm stage and nothing is measured on the host clock,
# so the same yaml gives the same counts on any machine. The numbers are
# Toshio 2510.25222 lines 1109-1114, tau_gen and ten tau_gen, with
# tau_gen the 1.0 us round period swept here. Every key is documented in
# reference.yaml.

extends: ../../bases/weak_decoder_baseline.yaml

weak_decoder:
  kind: 1.0                         # tau_gen, Toshio 2510.25222 lines 1109-1114
  units: 1
  input: copy
  boundary_fold: copy
  unit_memory:
    bits: null
  engine:
    clock: fridge
    fetch_cycles_per_round: 1
    fetch_cycles_per_job: 0
    release_cycles_per_job: 10
    release_cycles_per_round: 0

observation:
  data_movement: true               # the copy, reference and move counters
  trace: chrome                     # one traced shot a point, for residence.csv
  trace_shots: [0]
  check_windows_with: none
  log_component_io: false
  log: off

collection: {max_shots: 100}

sweep:
  - axes:                           # 1: every hop copies
      workload.arguments.physical_error_probability: [0.003]
      qpu.distance: [3, 5, 7]
      qpu.round_period_microseconds: [1.0]
  - axes:                           # 2: the weak input read in place
      weak_decoder.input: [in_place]
      workload.arguments.physical_error_probability: [0.003]
      qpu.distance: [3, 5, 7]
      qpu.round_period_microseconds: [1.0]
  - axes:                           # 3: the boundary folded in place
      weak_decoder.boundary_fold: [in_place]
      workload.arguments.physical_error_probability: [0.003]
      qpu.distance: [3, 5, 7]
      qpu.round_period_microseconds: [1.0]
  - axes:                           # 4: the strong tier and its links
      escalation:
        - kind: switching
          gap_threshold_db: 20.0    # the paper's threshold, Sec. IV
          strong_window: redo_window
      strong_decoder:
        - kind: 10.0                # ten tau_gen, Toshio 2510.25222
          units: 1
          input: copy
          unit_memory:
            bits: null
          engine:
            clock: room
            fetch_cycles_per_round: 1
            fetch_cycles_per_job: 0
            release_cycles_per_job: 10
            release_cycles_per_round: 0
      links.controller_to_strong_buffer:
        - {latency_cycles: 1, clock: room, bits_per_cycle: null}
      links.weak_decoder_to_strong_decoder:
        - {latency_cycles: 1, clock: room, bits_per_cycle: null}
      links.strong_buffer_to_strong_decoder:
        - {latency_cycles: 1, clock: room, bits_per_cycle: null}
      links.strong_decoder_to_frame:
        - {latency_cycles: 1, clock: room, bits_per_cycle: null}
      workload.arguments.physical_error_probability: [0.003]
      qpu.distance: [3, 5, 7]
      qpu.round_period_microseconds: [1.0]
