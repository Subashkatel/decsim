# Experiment 1 with belief matching as the strong tier, the strong
# decoder of Toshio et al. 2510.25222 (lines 1598-1606), on the same
# machine and shots as switching_baseline.yaml. Belief matching always
# returns a correction that explains the syndrome. Its time is the
# measured wall clock of each decode until a profiled law replaces it.
extends: switching_baseline.yaml

strong_decoder:
  kind: belief_matching
  units: 1                         # 2510.25222 lines 1273-1275
  unit_memory:
    bits: null
  engine:                          # as switching_baseline.yaml
    clock: room
    fetch_cycles_per_round: 0
    fetch_cycles_per_job: 0
    release_cycles_per_job: 0
    release_cycles_per_round: 0

# extends replaces a section whole, so the stop rule is restated here.
collection:
  max_failures: 100
  max_shots: 5000000
  min_shots: 0
  # 50 shots a piece, as in switching_baseline.yaml
  piece_rounds: 5000
