# Experiment 1, the full switching baseline: a union-find weak tier on
# Helios's cycle law beside a Relay-BP-5 strong tier at its measured A100
# time, escalating windows whose cluster gap is under 20 dB into
# double windows (Toshio et al. 2510.25222 Sec. III C). Every latency
# is held at one sourced value, so later experiments move one at a
# time. weak_alone.yaml runs the same machine and shots with no
# escalation. Every key is documented in reference.yaml.
#
# Sources: "lines" are the paper text copies decsim cites
# (sandbox tmp/papers/txt/<arXiv>.txt); Helios RTL is
# github.com/yale-paragon/Helios_scalable_QEC; "estimate" has no source.

qpu:
  kind: stim_device
  code_card: rotated_surface

workload:
  kind: producer
  function: decsim.producers:memory_circuit
  arguments:
    code_task: surface_code:rotated_memory_z
    rounds_per_shot: 100
    distance: ${qpu.distance}

clocks:
  fridge: 250.0                    # 2605.04892 line 1063; 2410.05202 lines 1021-1022
  room: 250.0                      # estimate; sets edge rounding only
  helios: 100.0                    # 2406.08491 lines 1229-1230

controller:
  clock: fridge
  readout_to_bits_cycles: 0        # inside qpu_to_controller (2605.04892 line 1054)
  packing_cycles_per_round: 8      # 29 ns, 2603.16203 lines 894-895
  packing_rounds_in_flight: null
  decision_to_pulse_cycles: 8      # QubiC trace, reference.yaml; after commit

detection_events:
  formed_at: [controller]          # our placement; 2408.13687 lines 471-477 form them in a workstation
  clock: fridge
  latency_cycles: 5                # 20 ns, 2605.04892 lines 1273-1275
  cycles_per_round: 1              # fully pipelined, same lines

links:
  kind: roce_v2_cpu                # 2.305 us round trip, 2609.09270 lines 35-36
  qpu_to_controller:               # 48 ns, 2605.04892 lines 1053-1055
    {latency_cycles: 12, clock: fridge, bits_per_cycle: null}
  controller_to_weak_buffer:       # 157 ns, 4 x 9.697 Gb/s, 2603.16203 lines 895-897, 972-974
    {latency_cycles: 40, clock: fridge, bits_per_cycle: 38.79, channels: 4}
  weak_buffer_to_weak_decoder:     # estimate, one on-chip cycle
    {latency_cycles: 1, clock: fridge, bits_per_cycle: null}
  # Known limit: the strong window's pinned faces ride this hop too
  # (escalation/strong_window_shapes.py:631), priced at one fridge cycle
  # though they cross to the room host.
  decoder_to_decoder:              # estimate, one on-chip cycle
    {latency_cycles: 1, clock: fridge, bits_per_cycle: null}
  weak_decoder_to_frame:           # 155 + 9 ns, 2603.16203 lines 902-904
    {latency_cycles: 41, clock: fridge, bits_per_cycle: 38.79, channels: 4}
  weak_decoder_to_strong_decoder: null   # roce_v2_cpu row: half the round trip
  strong_buffer_to_strong_decoder: null  # roce_v2_cpu row: 0, a host poll
  strong_decoder_to_frame: null          # roce_v2_cpu row: half the round trip
  controller_to_strong_buffer: null      # roce_v2_cpu row; unused by switching
  frame_to_controller:             # 32-bit word, 2404.15260 lines 188-190
    {latency_cycles: 0, clock: fridge, bits_per_cycle: 32}
  controller_to_qpu:               # 88 ns, 2605.04892 lines 1059-1061; 2404.15260 line 177
    {latency_cycles: 22, clock: fridge, bits_per_cycle: 128}

weak_syndrome_buffer:
  clock: fridge
  write_cycles: 0                  # estimate; paid once in windows.decision_cycles
  read_cycles: 0                   # estimate
  bits: null
strong_syndrome_buffer:
  bits: null

windows:
  kind: sliding
  commit_rounds: null              # d
  buffer_rounds: null              # d
  terminal_policy: lookahead       # both configs lay out the same last window
  clock: fridge
  decision_cycles: 5               # 20 ns, 2603.16203 lines 897-899

escalation:
  kind: switching
  confidence: cluster_gap
  confidence_walk_microseconds: 1.0   # owner value; estimate (2602.03336 lines 17-19)
  gap_threshold_db: 20.0              # owner's cluster-gap threshold, not a calibrated point:
                                      # the paper's 20 dB is on the complementary gap
  strong_window: double_window
  restart_reread_buffer_regions: 1    # the default, 2510.25222 Fig. 12
  run_both_at_once: false             # strong only after the verdict, 2510.25222 lines 632-640
  clock: fridge
  threshold_cycles: 1                 # estimate, one compare
  switch_cycles: 1                    # estimate, one state change

weak_decoder:
  kind: union_find
  units: 1                         # one weak, one strong: 2510.25222 lines 1273-1275
  input: copy
  boundary_fold: in_place          # 2301.08419 lines 632-640
  result_blocks_unit: false
  weight_step: 0.5                 # estimate, our conversion: Helios weights are integers
                                   # 2 to wmax (2406.08491 lines 1616-1620)
  cycle_count:                     # Helios RTL at 2dda998, reference.yaml
    clock: helios
    delay_cycles: 3                # Helios_single_FPGA_core.v:76
    setup_cycles: 0                # graph in registers, no setup
    setup_cycles_per_vertex: 0
    setup_cycles_per_edge: 0
    cycles_per_edge: 0.0           # one element per vertex
  unit_memory:
    bits: null
    word_bits: null                # whole frame handed over, 2603.16203 lines 668-669
  engine:
    clock: helios
    fetch_cycles_per_round: 1      # control_node_single_FPGA.v:169-171
    fetch_cycles_per_job: 1        # header byte, control_node_single_FPGA.v:137
    release_cycles_per_job: 3      # 25 ns, 2603.16203 line 902
    release_cycles_per_round: 0    # priced per message, same line

strong_decoder:
  kind: measured_table             # Slurm job 14676845, measured_table/measurements.py
  units: 1                         # 2510.25222 lines 1273-1275
  device: a100
  partition: whole
  bases: together
  gamma0: 0.35                     # surface code, 2506.01779 lines 306-307
  gamma_interval: [-0.254, 0.985]  # measured_table/measurements.py RELAY_BP_5
  pre_iterations: 80               # T0, 2506.01779 lines 303-305
  relay_set_count: 600             # R = 601 legs, 2506.01779 lines 343-344
  iterations_per_set: 60           # Tr, 2506.01779 lines 303-304
  converged_solution_count: 5      # Relay-BP-5, 2506.01779 line 343
  unit_memory:
    bits: null
  engine:                          # copies are inside the measured time
    clock: room
    fetch_cycles_per_round: 0
    fetch_cycles_per_job: 0
    release_cycles_per_job: 0
    release_cycles_per_round: 0

decoder_manager:
  clock: fridge
  dispatch_cycles: 0               # no manager on Helios's path, 2603.16203 lines 669-670
  bulk_strong: false               # one region a decode, 2510.25222 lines 1255-1258

pauli_frame:
  clock: fridge
  write_cycles: 1                  # 4 ns, 2605.04892 line 1051

idle_policy:
  kind: separate_decode_jobs       # inert for one memory patch
burst_detector:
  kind: none

observation:
  check_windows_with: none
  log_component_io: false
  log: off
  trace: off
  record_switching_windows: true   # escalated_fraction, strong_wait_*, strong_held_in_units_max
  backlog_trace: true              # backlog_peak_rounds
  data_movement: false
  confidence_shot_count: 100

sweep:
  - axes:
      workload.arguments.physical_error_probability: [0.0005, 0.001, 0.002, 0.003, 0.004, 0.005]
      qpu.distance: [5, 7, 9, 11, 13]
      qpu.round_period_microseconds: [1.0]

collection:
  max_failures: 100
  max_shots: 5000000
  min_shots: 0
  # 50 shots a piece: the slowest point, d=13 at p=0.005, is estimated
  # at up to 600 s a shot (the pilot's 32 s at d=9 p=0.003, about three
  # times the region's detectors, twice the escalations), so a piece is
  # at most about 8 hours, a third of a 24-hour task.
  piece_rounds: 5000
