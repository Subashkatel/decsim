# bposd as the weak tier alone, never escalating. Every other key is
# base.yaml's.

extends: base.yaml

escalation:
  kind: weak_baseline

weak_decoder:
  kind: bposd
  units: 1
  unit_memory_rounds: null
  engine:
    clock: fridge
    fetch_cycles_per_round: 1
    fetch_cycles_per_job: 0
    release_cycles_per_job: 10
    release_cycles_per_round: 0
