# Switching: pymatching escalating to bposd below the 20 dB complementary_gap.
# Every other key is base.yaml's.

extends: base.yaml

escalation:
  kind: switching
  confidence: complementary_gap
  gap_threshold_db: 20.0
  strong_window: near_seam_pinned

weak_decoder:
  kind: pymatching
  units: 1
  unit_memory_rounds: null
  engine:
    clock: fridge
    fetch_cycles_per_round: 1
    fetch_cycles_per_job: 0
    release_cycles_per_job: 10
    release_cycles_per_round: 0

strong_decoder:
  kind: bposd
  units: 1
  unit_memory_rounds: null
  engine:
    clock: room
    fetch_cycles_per_round: 1
    fetch_cycles_per_job: 0
    release_cycles_per_job: 10
    release_cycles_per_round: 0
