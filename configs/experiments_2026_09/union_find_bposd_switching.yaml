# Switching: union_find escalating to bposd below the 20 dB cluster_gap. Every
# other key is base.yaml's.

extends: base.yaml

escalation:
  kind: switching
  confidence: cluster_gap
  gap_threshold_db: 20.0
  strong_window: near_seam_pinned

weak_decoder:
  kind: union_find
  units: 1
  unit_memory_rounds: null
  engine:
    clock: fridge
    fetch_cycles_per_round: 1
    release_cycles_per_job: 10

strong_decoder:
  kind: bposd
  units: 1
  unit_memory_rounds: null
  engine:
    clock: room
    fetch_cycles_per_round: 1
    release_cycles_per_job: 10
