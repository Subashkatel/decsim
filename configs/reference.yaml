# The reference config: every key the yaml layer reads, in one runnable file,
# and the one home of the yaml surface's documentation: the shipped baselines
# stay comment-light and point here.
# Values here are the defaults the two shipped baselines
# (weak_decoder_baseline.yaml, strong_decoder_baseline.yaml) share; the tiny
# sweep makes this file cheap to run, so the test suite runs it as a smoke check.
#
# One section per component; a pluggable component's section carries a
# `kind` key naming a row of a table in that package's settings module,
# and each section is read by the package it configures (its
# settings.py). tests/experiments/test_yaml_surface.py loads this file, so
# a key its section no longer knows fails there; a key a reader gained is
# added here by hand, in the same commit. Knobs the yaml
# cannot reach are Python objects on the settings records: multi-op
# workloads, dynamic streams, routers, escalation families, schedulers,
# devices, policies.

qpu:
  kind: stim_device                # stim_device | timing_only | syndrome_bits
                                   # | recorded_stim | streaming_stim
                                   # | burst_stim: what the QPU reads out
                                   # each round. stim_device samples the
                                   # workload's circuit (real detector data);
                                   # timing_only states each round's size, the
                                   # code's check bits per round and its data
                                   # qubits on an operation's last, and the
                                   # width its events take once a seat forms
                                   # them (half the checks on the first round,
                                   # all of them after, and half again on the
                                   # last, as Stim's memory lays them out), and
                                   # carries no values (gem5's packet trace
                                   # keeps a size and no data,
                                   # src/proto/packet.proto); syndrome_bits
                                   # fills that size with seeded random bits.
                                   # streaming_stim takes repeated circuit
                                   # records keyed by dynamic stream owner,
                                   # which no yaml key carries: build it in
                                   # Python (QpuSettings(device=...)).
                                   # burst_stim is stim_device drawing each
                                   # shot from the circuit plus one error
                                   # burst the decoders are not told of
                                   # (their models stay the circuit's own,
                                   # as qec-burst-scaling's qecburst/
                                   # circuit.py does). A source row with keys
                                   # of its own reads them here (its
                                   # Settings); the sweep sets the distance
                                   # and the round period, so neither is a
                                   # key here. burst_stim's, with their
                                   # defaults (a probability of 0 is no
                                   # burst, and the shot is stim_device's):
  # burst_onset_round: 1           # the first one-based round with extra noise
  # burst_decay_rounds: null       # the extra probability in round r is
                                   # burst_error_probability x exp(-(r -
                                   # onset) / burst_decay_rounds), McEwen's
                                   # exponential recovery (2104.05219: about
                                   # 25 ms on Sycamore; 400-700 us on Willow,
                                   # 2408.13687); null holds it to the end
  # burst_radius: null             # Stim qubit-coordinate units around
                                   # burst_center; null is every qubit
  # burst_center: null             # [x, y]; null is the middle of the
                                   # qubits' coordinates
  # burst_error_probability: 0.0   # the extra probability at onset, 0 to 0.75
  # burst_channels: [gate, idle, measurement, reset]
                                   # the noise it raises, named for where
                                   # Stim's generator puts each parameter
                                   # (src/stim/gen/circuit_gen_params.cc):
                                   # after a unitary, after the round's first
                                   # TICK, before a measurement, after a
                                   # reset. [idle] is qec-burst-scaling's
                                   # one DEPOLARIZE1 per round on data qubits.
                                   # A burst raises the circuit's own noise,
                                   # so one whose region covers the patch
                                   # and finds none of its channels there
                                   # (a sweep point at p = 0) is refused
  code_card: rotated_surface       # rotated_surface | bivariate_bicycle: the
                                   # code card the run prices, at the sweep's
                                   # distance, with windows.commit_rounds and
                                   # buffer_rounds as its window sizes.
                                   # rotated_surface, the default, is Stim's
                                   # generated surface_code:rotated_memory_z:
                                   # d*d - 1 measure qubits read out every
                                   # round (Stim src/stim/gen/
                                   # gen_surface_code.cc); bivariate_bicycle is
                                   # Bravyi et al. 2308.07915, n/2 X and n/2 Z
                                   # checks a round. CUDA-Q QEC names its codes
                                   # the same way (code.h get_code(name,
                                   # options)). A card with keys of its own
                                   # reads them here; bivariate_bicycle's two,
                                   # with their defaults, the [[144, 12, 12]]
                                   # gross code's:
  # qubit_count: 144               # n, the physical qubits of one block
  # logical_qubit_count: 12        # k, the logical qubits it encodes

escalation:
  clock: fridge                    # a clocks domain; absent uses controller.clock
  threshold_cycles: 0              # confidence comparison before forming a
                                   # verdict, only for a policy that uses a
                                   # confidence and a result that carries one
  switch_cycles: 0                 # escalation control before issuing or
                                   # selecting the strong request; a kept result
                                   # pays none. Both costs default to zero and
                                   # then run without edge rounding. Positive
                                   # costs finish on this clock's edge, as gem5
                                   # src/mem/XBar.py separates its frontend and
                                   # forwarding cycles
  kind: weak_baseline              # weak_baseline | strong_only | switching.
                                   # strong_only reads static and live windows
                                   # out of the strong syndrome buffer, moves
                                   # inputs on strong_buffer_to_strong_decoder
                                   # and returns results on
                                   # strong_decoder_to_frame; idle rounds use
                                   # only the strong path. switching adds the
                                   # keys below (refused for any other kind, so
                                   # they are documented as comments;
                                   # two_tiers.yaml is the shortest config
                                   # that runs them):
# escalation:
#   kind: switching
#   confidence: complementary_gap  # complementary_gap | cluster_gap |
#                                  # extra_cluster_gap: the signal the weak
#                                  # tier reports and the threshold decides
#                                  # on, in natural-log weight in every case.
#                                  # complementary_gap decodes the window
#                                  # twice, each solve pinned to one logical
#                                  # class, and subtracts the two weights
#                                  # (Toshio 2510.25222 Sec. III A), so it needs
#                                  # a weak decoder that minimises weight inside
#                                  # a class: pymatching and
#                                  # unweighted_pymatching today. Its two
#                                  # solves are submitted at one instant as
#                                  # two ordinary jobs of the weak pool, so
#                                  # weak_decoder.units alone decides whether
#                                  # they overlap, and a priced weak card,
#                                  # which prices one decode of one window,
#                                  # is charged once per solve. cluster_gap
#                                  # decodes the window once and walks the
#                                  # growth that decode did (Meister 2405.07433
#                                  # Algorithm 2), so it needs a cluster-based
#                                  # decoder: union_find today, one job and
#                                  # one card per window. extra_cluster_gap
#                                  # decodes the window once and grows every
#                                  # cluster on, half a weight_step a tick,
#                                  # until the two boundaries join or the
#                                  # threshold's worth of growth is spent
#                                  # (Kishi 2602.03336 Algorithm 1); the gap is
#                                  # the growth spent, infinite when the limit
#                                  # came first, and under a union_find
#                                  # cycle_count its cost is the growth's own
#                                  # cycles, (2 + delay_cycles + 1) a tick plus
#                                  # the merges. It needs the threshold as one
#                                  # number when the machine is built, so
#                                  # threshold_source online is refused with
#                                  # it. The pairing is
#                                  # refused by name at load when the weak row's
#                                  # decode cannot produce the signal's evidence.
#                                  # A signal's own computation is charged on
#                                  # the weak unit that produced the evidence
#                                  # (docs/explanation/decisions.md, D8)
#   confidence_walk_microseconds: 12.0  # what the signal's own computation
#                                  # costs on the weak unit, priced as a card
#                                  # the way a decoder tier is. null, the
#                                  # default, leaves each row on its own cost
#                                  # model: complementary_gap subtracts two
#                                  # numbers the decodes already reported and
#                                  # charges nothing, cluster_gap measures its
#                                  # walk on the host clock the way a measured
#                                  # decoder is, so a run with it reports a
#                                  # longer weak service. A number is charged
#                                  # once per window on the unit that produced
#                                  # the evidence; negative or not a number is
#                                  # refused by name
#   gap_threshold_db: 20.0         # keep the weak result when its complementary
#                                  # gap is at or above this, in the paper's
#                                  # decibels (Toshio 2510.25222 gth = 20 dB).
#                                  # threshold_source table computes the value
#                                  # instead and refuses this key. A negative,
#                                  # infinite or non-numeric value is refused,
#                                  # here and in a table entry
#   threshold_source: fixed        # fixed | table | online. fixed uses
#                                  # gap_threshold_db as given. table looks the
#                                  # sweep point up in an offline calibration csv
#                                  # and refuses uncalibrated points. online
#                                  # starts at gap_threshold_db and adapts it
#                                  # across the point's shots (serial only)
#   threshold_table: cal.csv       # table only: a calibration csv with
#                                  # columns distance and p and one threshold
#                                  # column per method, in dB, set as Toshio
#                                  # 2510.25222 Sec. III B sets g_th (brute
#                                  # force, or Eq. (4)); path relative to this
#                                  # config file. Calibrate for this run's
#                                  # window geometry; thresholds do not transfer
#                                  # between geometries
#   threshold_column: gth_eq4_wilson  # table only: which computed column;
#                                  # gth_brute_force | gth_eq4 | gth_eq4_wilson
#                                  # (default: the Wilson-conservative one)
#   online:                        # online only; defaults are the validated
#                                  # drift-replay configuration. A knob that
#                                  # is no finite number is refused
#     target_escalation_rate: 1e-3 # the rate tracker's starting duty target
#     step_db: 0.25                # threshold step per window (adaptive
#                                  # conformal recursion, arXiv:2106.00170)
#     audit_rate: 0.01             # the fraction of kept windows the strong
#                                  # tier decodes anyway, so the run learns
#                                  # whether a kept window was right. Without it
#                                  # the run sees the truth only for windows it
#                                  # already escalated, which would bias the
#                                  # threshold (the selective-labels bias; set
#                                  # dueling samples the same way)
#     kept_bad_budget: 2e-4        # the allowed probability that a window is
#                                  # kept and the strong tier would have changed
#                                  # its answer. One failed audit doubles the
#                                  # target escalation rate, and only
#                                  # ceil(3/budget) clean audits in a row halve
#                                  # it back: that many clean samples bound a
#                                  # rate under the budget (the rule of three)
#     adjust_factor: 2.0           # the raise/relax multiplier
#     min_escalation_rate: 1e-5    # the target's floor
#     max_escalation_rate: 0.30    # the strong duty's cap, audits included:
#                                  # the audits reach the strong tier beside
#                                  # the target, so the target stays at or
#                                  # under this minus audit_rate and the duty
#                                  # Theorem 1 bounds stays under this
#   run_both_at_once: false        # Toshio 2510.25222 Sec. III A Step 1 (lines
#                                  # 598-601): the strong decoder starts with the
#                                  # weak one on the same syndrome and is cancelled
#                                  # when the weak result is confident. false, the
#                                  # default, is the same section's on-demand
#                                  # variant (lines 631-640): the strong decode
#                                  # starts at the verdict, after the
#                                  # weak_decoder_to_strong_decoder hop, which the
#                                  # paper expects to cost little because the
#                                  # switching rate decays with the code distance
#   strong_window: near_seam_pinned  # near_seam_pinned |
#                                  # forward_seam_pinned: the shape
#                                  # of the window the strong tier re-decodes
#                                  # (STRONG_WINDOW_SHAPES in
#                                  # escalation/strong_window_shapes.py).
#                                  # near_seam_pinned, the default, re-decodes
#                                  # the escalated window's commit region and
#                                  # pins its past face on the earlier
#                                  # neighbour's committed correction: the
#                                  # input carries d(e + kappa) on the seam
#                                  # layer (Bombin 2303.04846 lines 775-788)
#                                  # and the row reads no round behind its
#                                  # commit region, since a fixed boundary
#                                  # condition needs no buffer (lines
#                                  # 1456-1458). Its open future face keeps one
#                                  # buffer region, which is Bombin's b >= d
#                                  # (lines 850-852) when windows.buffer_rounds
#                                  # is the distance. It escalates with Held
#                                  # boundaries, serially or beside the weak
#                                  # decode (run_both_at_once).
#                                  # forward_seam_pinned is the paper's
#                                  # Sec. III C as it is stated: the weak chain
#                                  # keeps committing past an escalated strong
#                                  # window of r_com + 2 r_buf rounds, which
#                                  # is read with no context, its near face
#                                  # pinned on the window before it and its
#                                  # far face on the restart window's weak
#                                  # commit (Toshio 2510.25222 lines
#                                  # 1248-1259). It absorbs the windows it
#                                  # covers, re-slices the one past it,
#                                  # leaves the faults crossing its far face
#                                  # to the restart window, and reads one
#                                  # buffer region of raw context on a near
#                                  # face that no committed correction closes
#   restart_reread_buffer_regions: 1  # forward_seam_pinned only: how many
#                                  # of the strong region's buffer regions
#                                  # the restarted weak window re-reads. Toshio
#                                  # 2510.25222 lines 1229-1235 resume the weak
#                                  # decoder once commit plus buffer rounds are
#                                  # stored after the strong region, which both
#                                  # values meet. 1, the default, re-reads
#                                  # the region's last buffer region as the
#                                  # restart window's past context, as Fig. 12
#                                  # step 5 draws it; the strong region leaves
#                                  # the crossing faults to the restart window
#                                  # its far face pins on. It costs the weak
#                                  # syndrome buffer one more buffer region
#                                  # per bounded window. 0 reads
#                                  # nothing inside the region, and the
#                                  # restart window owns the faults of the
#                                  # rounds it reads

burst_detector:
  kind: none                       # none | event_count. none builds no
                                   # detector. event_count counts each
                                   # round's bulk detection events where
                                   # they are formed and flags a burst; a
                                   # flagged window escalates under
                                   # escalation.kind switching, the only kind
                                   # it is accepted with. Its keys (refused
                                   # under none, so documented as comments):
# burst_detector:
#   kind: event_count
#   patch_window_rounds: 4         # W: fires when the patch's events over
#                                  # the last W rounds pass their threshold
#                                  # (Tan 2406.18897 lines 956-966 at W = 1)
#   detector_window_rounds: 20     # c_win: fires when one stabiliser
#                                  # position's events over the last c_win
#                                  # rounds pass its own threshold (Q3DE
#                                  # 2501.00331 lines 713-727)
#   false_alarms_per_round: 1.0e-6 # the detector's false-alarm budget per
#                                  # round per patch, half for each count,
#                                  # the per-position half split evenly
#                                  # over the positions; a threshold is the
#                                  # smallest count whose tail under the
#                                  # usual rates is at most its share,
#                                  # calibrated from the operation's own
#                                  # circuit: its faults' exact law, the
#                                  # tail estimated by draws, so a
#                                  # noiseless circuit fires on one event
#   rate_tracking_rounds: 10000    # time constant of each position's usual
#                                  # rate, an exponential average frozen
#                                  # while a flag fires (DGR 2311.16214
#                                  # lines 216-218)
#   clock: fridge                  # a clocks domain; needed when
#                                  # cycles_per_round is above 0
#   cycles_per_round: 0            # what counting one round costs; a
#                                  # round's verdict is published that many
#                                  # cycles after it is formed, rounds in
#                                  # order. 0 leaves it unpriced (Q3DE gives
#                                  # no count, lines 1428-1434)
#   raise_strong_priors: false     # true gives a flagged strong window's
#                                  # model the burst priors: the faults at
#                                  # the anomalous positions in the flagged
#                                  # rounds get their priors scaled to
#                                  # explain the measured rate, the graph
#                                  # unchanged (IonQ 2608.25027 lines
#                                  # 334-340)

workload:
  kind: memory_circuit             # memory_circuit | memory_patches are the
                                   # yaml rows; the other rows (circuit_list,
                                   # surgery_ir) are built in Python.
                                   # memory_patches runs patch_count copies of
                                   # the memory circuit at once, one operation
                                   # per patch sharing the decoder units
                                   # (Elastic 2406.17995 lines 121-123), side
                                   # by side along x, 2d + 2 Stim coordinate
                                   # units apart, so a qpu burst region covers
                                   # the patches it reaches
  code_task: surface_code:rotated_memory_z   # stim generator task
  rounds_per_shot: 15              # QEC rounds per shot: a fixed count, or
                                   # "<n>d" to scale with the swept distance
                                   # ("10d" = the 10 d-round memory experiment,
                                   # Toshio 2510.25222 Fig. 4)
  # patch_count: 4                 # memory_patches only, and required there:
                                   # the patches, at least 1

# The plan, a word the comments below use, is the list of windows the scheme
# lays out for each operation before the run starts.
windows:
  clock: fridge                    # a clocks domain; absent uses controller.clock
  decision_cycles: 0               # per-submission readiness decision before
                                   # the decode queue admits the job. Zero is
                                   # synchronous, without edge rounding; positive
                                   # costs end on this domain's clock edge.
                                   # gem5 src/mem/XBar.py frontend_latency;
                                   # RISC-Q 2603.16203 lines 893-904 times
                                   # aggregation and distribution separately
  kind: sliding                    # sliding | parallel | sandwich | naive_online
  commit_rounds: null              # rounds committed per window; null = d. The
                                   # sandwich row needs at least 2: it lays each
                                   # step as one seam round and s - 1 core
                                   # rounds, which is decsim's own layout and
                                   # not the paper's
  buffer_rounds: null              # look-ahead rounds per window; null = d
  terminal_policy: null            # flush | lookahead: how a finite stream drains
                                   # its last buffered window. flush ends the last
                                   # window at the stream's last round, qLDPC's last
                                   # window (qLDPC src/qldpc/decoders/sinter.py:
                                   # 776-777); lookahead
                                   # keeps the regular stride, so the last window
                                   # still reads rounds past its own commit. null,
                                   # the default, leaves the row on flush, and on
                                   # lookahead when the escalation may escalate,
                                   # since a strong recovery needs a last window
                                   # with context to read. Only the sliding row
                                   # reads this key; the other three lay their own
                                   # tail.
  boundaries: null                 # eager | held: when a committed window ships
                                   # its boundary to the windows after it. eager
                                   # ships at every commit, held only when the
                                   # committing result is final. null, the default,
                                   # is the row the escalation policy declares, or
                                   # its strong window shape's when the policy may
                                   # escalate (default_boundary_policy): held when
                                   # the escalation may escalate and the strong
                                   # window does not absorb the weak windows it
                                   # covers, and eager otherwise; a
                                   # provisional boundary that ships is never
                                   # revised when the strong tier answers later
                                   # (Toshio 2510.25222 Sec. III A).
  boundary_payload: dense_seam_mask # dense_seam_mask | sparse_seam_list: how a
                                   # window's hand-off to its neighbour is
                                   # written on decoder_to_decoder. The message
                                   # updates the detectors of the neighbour's
                                   # oldest round layer and nothing else (Tan
                                   # 2209.09219 lines 936-946; quits
                                   # sliding_window.py:164-174; cuda-q QEC
                                   # sliding_window.cpp:325-344). dense_seam_mask
                                   # charges one bit per detector of that layer
                                   # (d*d-1 on a bulk layer), the mask both
                                   # compiled implementations carry, so the cost
                                   # does not move with the noise.
                                   # sparse_seam_list charges one index per
                                   # flipped detector, ceil(log2(seam
                                   # detectors)) bits each: Skoric's artificial
                                   # defect list (2209.08552 lines 265-269,
                                   # 1038-1040) and Bombin's "small number of
                                   # check generators" (2303.04846 lines
                                   # 784-786)

# The sweep: a list of blocks; each block is the cross product of its three
# axes, `shots` seeds per point (0..shots-1); a point named twice runs
# once. The algorithm is NOT a sweep axis: it is structure, fixed per unit
# on the decoder sections below; comparing algorithms is comparing configs.
# The baselines put shots where they matter: a timing block sweeps many
# round periods with few shots (the weak baseline's 0.9/0.85/0.8 bracket
# the load = 1 knee of its 0.028 card), and an LER block sweeps several
# probabilities with many shots at one timing point, since timing knobs
# never change the decoded answer.
sweep:
  - physical_error_probability: [0.001]    # p on all four Stim noise channels
    distance: [3]                          # code distance d; one LER curve per d
    round_period_microseconds: [1.0]       # the QPU's physical round period:
                                           # a quantum-device cadence, deliberately
                                           # not a classical clock's cycles
    shots: 2

controller:                        # controller work per round, in cycles of its
                                   # named clock domain
  clock: fridge
  readout_to_bits_cycles: 0        # post-readout classification; the QPU
                                   # measurement window remains in the QEC
                                   # cycle. Classification is inside the priced
                                   # round: Google's 921 ns cycle includes the
                                   # 500 ns measurement and 160 ns reset (Nature
                                   # 614, 2023, arXiv 2207.06431, Methods)
  decision_to_pulse_cycles: 8      # the control processor's issue pipeline,
                                   # from the decision at the core to the pulse
                                   # trigger, traced on QubiC's core (Fruitwala
                                   # 2404.15260 Sec. III and IV: a multi-cycle
                                   # state machine with pipelined fetching, the
                                   # jump_fproc instruction halted until the
                                   # function processor returns its 32-bit word,
                                   # pulse_write_trig writing the pulse register
                                   # and arming the trigger) with gem5's MinorCPU
                                   # stage delays where the paper gives none: 1
                                   # the result latched with its ready signal, 1
                                   # the compare, 1 the taken jump's redirect, 3
                                   # the target instruction fetched, decoded and
                                   # reaching execute, 1 the pulse register
                                   # written, 1 the strobe on the next edge. The
                                   # taken branch is the cost because both paths
                                   # are padded to it (Caune 2410.05202: the
                                   # qubit idles for the gate's duration when the
                                   # result is 0). One core per qubit runs the
                                   # same branch on the broadcast bits, so the
                                   # count does not grow with the patch. QICK
                                   # measures the same path on its deeper
                                   # tProcessor: 16 clocks for the conditional
                                   # evaluation and the address jump and 20 for
                                   # the next pulse through the generator's
                                   # queue (2110.00557 lines 893-900), 36 in all;
                                   # a QICK-shaped controller sets 36.
                                   # controller_to_qpu is a separate link
  packing_cycles_per_round: 0      # packet assembly cost, charged once per
                                   # completed round. Caune et al. 2410.05202
                                   # measure 250 to 370 cycles for packetization,
                                   # bus transfer, result return and the
                                   # conditional together: an upper bound here
  packing_rounds_in_flight: null   # packing assembly workspace: rounds in flight
                                   # through the packing stage, a whole count of
                                   # at least one. null = unbounded
  packing_overflow: stall          # stall | drop_round: what the controller does
                                   # with a finished round the weak syndrome buffer (or the packing
                                   # workspace) cannot take. stall holds it upstream
                                   # and writes it in order once a slot frees, the
                                   # backpressure real-time stacks apply to their
                                   # source (Caune et al. 2410.05202: the sequencer
                                   # polls the decoder's status register and stalls);
                                   # under stall a full packing workspace stops the
                                   # run. drop_round drops it instead, ns-3's drop
                                   # tail (point-to-point-net-device.cc Send:
                                   # Enqueue false, the packet is dropped).
                                   # LILLIPUT's readout buffer overwrites the latest
                                   # value (2108.06569), a storage choice neither
                                   # word models

detection_events:                  # where a round's raw measurement outcomes
                                   # become its detection events, and what it
                                   # costs. The events are a parity of the raw
                                   # outcomes, the same wherever they form; the
                                   # seat moves the width every hop after it
                                   # carries, the state the seat holds and the
                                   # clock the conversion is charged on
  formed_at: [controller]          # the seats that form: controller |
                                   # weak_syndrome_buffer |
                                   # strong_syndrome_buffer | weak_decoder |
                                   # strong_decoder, each named once. Every
                                   # path a round takes to a decoder crosses
                                   # exactly one of them, refused at build
                                   # otherwise: controller, weak buffer, weak
                                   # decoder; controller, weak buffer, strong
                                   # buffer, strong decoder (a switching run's
                                   # escalated region); controller, strong
                                   # buffer, strong decoder (strong_only).
                                   # controller is Google's workstation,
                                   # "inside the workstation, measurements are
                                   # converted into detections and then
                                   # streamed to the real-time decoding
                                   # software via a shared memory buffer"
                                   # (2408.13687 lines 474-476). A store seat is
                                   # the decoder chip's input path, whose
                                   # "detector window processing component
                                   # calculates parities of groups of
                                   # measurements" (Maurer 2510.21600 lines
                                   # 234-236), ahead of the store. A decoder
                                   # seat is the tier's own logic in front of
                                   # its core: the controller writes the
                                   # outcomes "sequentially to the decoder" and
                                   # "The decoder computes the syndrome from
                                   # measurement outcomes" (Caune 2410.05202
                                   # lines 1252-1255), LILLIPUT's Event
                                   # Detection Logic block (2108.06569 lines
                                   # 500-509). Every seat keeps its own history
                                   # of the raw packets its recipes read. A
                                   # detector compares a round against the one
                                   # before it (LILLIPUT lines 499-510), so a
                                   # decoder seat that has not formed a job's
                                   # first round reads the raw round before it
                                   # with the job, and a strong side that forms
                                   # reads the raw round before each escalated
                                   # region; both ride as raw bits
  # clock: fridge                  # the clock the cycles below count on;
                                   # absent uses controller.clock
  latency_cycles: 0                # one conversion's fixed latency. A seat
                                   # that forms a round at a time (the
                                   # controller, a store) pays it per round; a
                                   # decoder seat forming a job's n new rounds
                                   # pays it once plus cycles_per_round for
                                   # each round after the first. Yang et al.
                                   # 2605.04892 lines 1273-1275: "All variables
                                   # are stored in FPGA registers, enabling
                                   # fully pipelined operation. The total
                                   # latency of the preprocessing stage for
                                   # syndrome calculation is fixed at 20 ns (5
                                   # FPGA clock cycles)", counted inside
                                   # "Subtotal (decoder) 148" in their Table I
                                   # (lines 1049-1052), so a Yang-shaped decoder
                                   # seat writes 5 here. No source publishes a
                                   # controller-side or store-side figure, so
                                   # 0 is the default
  cycles_per_round: 0              # the rate the pipelined stage takes rounds
                                   # at: fully pipelined (Yang 2605.04892 line
                                   # 1273) is one round a clock, so 1 beside
                                   # Yang's latency

clocks:                            # clock domain name -> MHz; a link prices its
                                   # cycles on the domain it names. More domains
                                   # (an mK stage, a 4K SFQ decoder) are one more
                                   # entry here. Both start at LILLIPUT's 250 MHz
                                   # ([d=3,m=2] FPGA clock, 2108.06569 Table 4).
                                   # A component charges its cycles from the
                                   # edge at or after the tick it stands on, so
                                   # work begun mid-cycle waits out that cycle
                                   # (gem5 clockEdge, src/sim/clocked_object.hh
                                   # lines 174-186). A cost of zero cycles is
                                   # uncharged, never rounded to an edge.
  fridge: 250.0
  room: 250.0

links:                             # a kind, then one card per path; null = the
                                   # chosen row's numbers for that path
  kind: logical_reference          # logical_reference | bandwidth_limited |
                                   # roce_v2_cpu | roce_v2_gpu | nvqlink_gpu
                                   # (LINK_FABRICS, links/link_profiles.py). The row
                                   # supplies the numbers the per-path cards below
                                   # override and builds the fabric the run sends
                                   # on. logical_reference prices every one of the
                                   # eleven hops from a system of this scale, a
                                   # latency plus the hop's bits over its rate:
                                   # the weak loop from Yang 2605.04892 Table I
                                   # (readout 48 ns; controller to weak buffer and
                                   # weak decoder to frame 18 ns each, half of its
                                   # 36 ns digital communication; pulse path 88 ns),
                                   # every hop to or from the strong node at Caune
                                   # 2410.05202 Fig. 1a F (260 ns), the on-chip
                                   # hops one 250 MHz cycle, a stated assumption,
                                   # and the frame's word to the controller no
                                   # propagation. Rates: a 32-bit word per 250 MHz
                                   # cycle on the decoder bus and on chip (Caune
                                   # lines 998-1008), a 128-bit instruction word
                                   # per cycle to the pulse generator (QubiC
                                   # 2404.15260), 100 Gb/s off board (Backline
                                   # 2609.09270 lines 1229-1230). The readout and
                                   # the seam are unbounded: every qubit and every
                                   # graph edge has its own channel. Transfers on
                                   # one bounded hop queue for its wire.
                                   # bandwidth_limited provisions each channel from
                                   # the sweep point's own geometry and is refused
                                   # here: a caller builds its card with
                                   # link_profiles.bandwidth_limited_profile and
                                   # passes it as the machine's links setting.
                                   # roce_v2_cpu is the reference card with the
                                   # strong tier's off-board hops priced by
                                   # Backline's measured FPGA-to-CPU round trip over
                                   # RoCE v2 (2609.09270 Table III), half of the
                                   # 2.305 us median on each leg it crosses, the
                                   # bits at the cable's 100 Gb/s on top.
                                   # roce_v2_gpu is the same card on the FPGA-to-GPU
                                   # round trip, 4.5 us in the median.
                                   # nvqlink_gpu is the same split on NVQLink's
                                   # FPGA-to-GPU round trip over RoCE, a persistent
                                   # kernel looping each packet back, 3.839 us in
                                   # the steady-state median (2510.25213 line 485),
                                   # at its 100 Gb Ethernet rate, on an unreliable
                                   # connection, so the ideal protocol row.
                                   # Each card, in cycles of its named clock domain;
                                   # every card writes latency_cycles, clock and
                                   # bits_per_cycle, and a key not listed here is
                                   # refused:
                                   #   latency_cycles: propagation latency
                                   #   clock: the domain (a clocks: key)
                                   #   bits_per_cycle: per-lane capacity
                                   #     (null = unbounded)
                                   #   channels: parallel lanes, each moving
                                   #     bits_per_cycle (default 1); aggregate
                                   #     bandwidth = bits_per_cycle x channels
                                   #     per period of the clock domain
                                   #   setup_cycles_per_transfer: optional fixed
                                   #     per-transfer DMA setup (setups serialize)
                                   #   header_bits_per_transfer: optional framing
                                   #     every transfer of the path carries beside
                                   #     its payload; the wire serializes both
                                   #     (ns-3 adds a header to every packet and
                                   #     times the packet with it,
                                   #     point-to-point-net-device.cc:528 and :243),
                                   #     so it costs time on a bounded channel
                                   #     only. CUDA-Q's real-time messages put a
                                   #     24 byte RPCHeader and 32 bytes of enqueue
                                   #     fields in front of the syndromes, 448
                                   #     bits, and a 24 byte RPCResponse in front
                                   #     of a reply, 192 bits (cudaqx
                                   #     decoder_rpc_wire_format.h lines 41-43
                                   #     and 62-69)
                                   #   protocol: optional; how the path's
                                   #     channel moves a message (PROTOCOLS,
                                   #     links/fabric.py). Absent is kind
                                   #     ideal: the whole transfer on an
                                   #     unbounded receive buffer, nothing
                                   #     lost, the law above. A packet
                                   #     protocol needs a bounded wire:
                                   #     kind: ideal | credit | reliable
                                   #     framing: how a message is cut into
                                   #       frames (FRAMINGS, links/framings.py):
                                   #       {kind: whole} one frame;
                                   #       {kind: flits, flit_bits: F} Garnet's
                                   #       divCeil flits; {kind: aurora_64b66b}
                                   #       n octets in n/8 + 1 66-bit blocks
                                   #       (SP011); {kind: pcie_tlp,
                                   #       max_payload_bytes: MPS} 24 bytes on
                                   #       every TLP (pcie-bench); {kind:
                                   #       roce_v2, path_mtu_bytes: M}, the
                                   #       one framing of the reliable row, and
                                   #       {kind: ethernet_udp, mtu_bytes: M}
                                   #       with their headers (Linux rxe,
                                   #       pcie-bench eth.py). Line-coded rows
                                   #       (flits, aurora) are priced at the
                                   #       line rate, byte rows at the data
                                   #       rate after the physical coding
                                   #     receive_buffer_frames: frames the
                                   #       receiver holds; a frame goes only
                                   #       with a credit (Garnet OutVcState.cc
                                   #       56-63); credit and reliable
                                   #     credit_latency_cycles: from the
                                   #       receiver taking a frame to its
                                   #       credit at the sender; Aurora's
                                   #       native flow control is this row
                                   #       with its 256-block bound here
                                   #     window_packets, ack_every_packets,
                                   #       retransmit_timeout_cycles,
                                   #       retry_count, bit_error_rate:
                                   #       reliable only; the
                                   #       go-back-N recovery of Linux rxe
                                   #       (rxe_req.c, rxe_resp.c), whose
                                   #       own constants are a window of 129
                                   #       and an ACK every 66 packets. ACKs
                                   #       and NAKs are RoCE frames on the
                                   #       reverse direction, lost by the same
                                   #       law. Each lost frame is resent
                                   #       inside the link, so messages still
                                   #       arrive once and in order. retry_count
                                   #       (0 to 7) is rxe's retry_cnt: the
                                   #       retries allowed without an ACK
                                   #       between them, 7 never spent; a retry
                                   #       with none left fails the run, naming
                                   #       the channel and the frame. For example:
                                   #   controller_to_weak_buffer: {latency_cycles: 1,
                                   #     clock: fridge, bits_per_cycle: 8.0,
                                   #     protocol: {kind: credit, framing:
                                   #     {kind: flits, flit_bits: 8},
                                   #     receive_buffer_frames: 4,
                                   #     credit_latency_cycles: 1}}
  qpu_to_controller: {latency_cycles: 1, clock: fridge, bits_per_cycle: null}
                                   # QPU -> controller, one readout
  controller_to_weak_buffer: {latency_cycles: 1, clock: fridge, bits_per_cycle: 1.0, channels: 8}
                                   # controller -> weak syndrome buffer (the weak
                                   # buffer), one round
  controller_to_strong_buffer: null
                                   # controller -> strong syndrome buffer (the strong
                                   # buffer), one round: a strong-only run's one
                                   # transport. A switching run sends nothing here;
                                   # its strong side gets the escalated window's
                                   # rounds over weak_decoder_to_strong_decoder
  weak_buffer_to_weak_decoder: {latency_cycles: 1, clock: fridge, bits_per_cycle: null}
                                   # weak syndrome buffer -> weak decoder, one window
  weak_decoder_to_strong_decoder: null
                                   # weak -> strong: the escalation's selection, then
                                   # the strong window's rounds, read out of the
                                   # weak syndrome buffer (rcom + 2 rbuf of them)
  strong_buffer_to_strong_decoder: null
                                   # strong syndrome buffer -> strong decoder, one window
  decoder_to_decoder: {latency_cycles: 1, clock: fridge, bits_per_cycle: null}
                                   # decoder -> decoder boundary handoff
  weak_decoder_to_frame: {latency_cycles: 1, clock: fridge, bits_per_cycle: null}
                                   # weak decoder -> Pauli frame
  strong_decoder_to_frame: null    # strong decoder -> Pauli frame
  frame_to_controller: {latency_cycles: 0, clock: fridge, bits_per_cycle: 32}
                                   # Pauli frame -> controller, a release: one
                                   # 32-bit word with a ready signal (QubiC
                                   # 2404.15260 lines 186-190)
  controller_to_qpu: {latency_cycles: 22, clock: fridge, bits_per_cycle: 128}
                                   # controller -> QPU, an instruction: trigger,
                                   # waveform and DAC, 16 + 32 + 40 ns (Yang
                                   # 2605.04892 Table I), one 128-bit word a cycle

weak_syndrome_buffer:            # the weak syndrome buffer, on the decoder chip
  clock: fridge                    # a clocks domain; absent uses controller.clock
  write_cycles: 0                  # this and read_cycles are the
                                   # syndrome_buffer row's own keys.
                                   # per-round write before storage/publication
  read_cycles: 0                   # one read of a decode's rounds, paid when
                                   # they leave the store at dispatch, for copy
                                   # (then the move) or in_place (then the
                                   # decode), and one read of an escalated
                                   # region's rounds before they go up. A read
                                   # never waits for another.
                                   # Both default to zero, with no edge rounding.
                                   # Positive costs finish on this clock's edge.
                                   # FIFO intake and window trigger: IBM
                                   # 2510.21600 lines 500-509; separate stage
                                   # cycles: gem5 src/mem/XBar.py frontend_latency
                                   # and forward_latency
  kind: syndrome_buffer            # syndrome_buffer | ported_syndrome_buffer.
                                   # syndrome_buffer prices a write and a read
                                   # by write_cycles and read_cycles above, and
                                   # no access waits for another.
                                   # ported_syndrome_buffer stores a round in
                                   # whole words and serves each write and read
                                   # in arrival order on the port that frees
                                   # first: k = sum over its rounds of
                                   # ceil(bits / word_bits) accesses hold the
                                   # port k x cycles_per_access cycles, and the
                                   # data is usable access_latency_cycles later
                                   # (gem5 src/mem/simple_mem.cc:154-174 and
                                   # src/mem/xbar.cc:135, 206, 288-289). It
                                   # refuses write_cycles and read_cycles, and a
                                   # rate on links.weak_buffer_to_weak_decoder,
                                   # which would price the same read twice. Its
                                   # own keys, with their defaults (the sky130
                                   # pseudo dual port FIFO, one byte a clock):
  # read_ports: 1                  # ports that only read (OpenRAM num_r_ports)
  # write_ports: 1                 # ports that only write (num_w_ports)
  # read_write_ports: 0            # ports that do either (num_rw_ports); 1 with
                                   # the two above at 0 is a single-port memory
  # word_bits: 8                   # bits one access moves; AFS is 32 with
                                   # cycles_per_access 4 (2001.06598 lines
                                   # 529-531, 1107-1110)
  # cycles_per_access: 1           # cycles one access holds its port
  # access_latency_cycles: 0       # cycles after the last access before the
                                   # data is usable
  bits: null                       # capacity in bits, the unit a memory is
                                   # declared in (gem5 states its packet store
                                   # in bytes on the store itself,
                                   # src/dev/net/Ethernet.py rx_fifo_size).
                                   # When it is full the controller holds the
                                   # finished round and publishes it in order
                                   # once a slot frees, the backpressure real
                                   # systems apply to their source;
                                   # controller.packing_overflow chooses that
                                   # hold or a drop. null = unbounded. A
                                   # bounded store refuses a round that states
                                   # no size.
                                   # A store holds its widest hold's rounds
                                   # at once: a window's reads, and in a
                                   # switching run its strong context; the
                                   # last round of a memory is the widest. A
                                   # smaller store stops the run naming that
                                   # hold and the round it waits for. Round
                                   # widths come from the source as it runs,
                                   # so the load does not check this.

strong_syndrome_buffer:          # the strong syndrome buffer, on the strong host
                                   # (exists only when the escalation uses it)
  kind: syndrome_buffer
  bits: null                       # capacity in bits, as above. A strong-only
                                   # run's controller holds a finished round
                                   # that finds no room, the same waiting line
                                   # the weak syndrome buffer uses; a switching
                                   # run's escalated region cannot wait, so a
                                   # store with no room for it stops the run.
                                   # null = unbounded
                                   # This buffer stores a round as it lands and
                                   # charges no cycles, so the weak syndrome
                                   # buffer's cost keys and clock are refused
                                   # here, whatever their value

# The two decoder tiers are two distinct units (Toshio 2510.25222:
# lightweight decoders decode constantly, a separate accurate decoder is
# invoked on demand). The escalation kind picks the active unit:
# weak_baseline decodes on weak_decoder, strong_only on strong_decoder;
# the unused tier's section may be omitted.
weak_decoder:                      # the lightweight tier: fast, higher LER
  kind: pymatching                 # pymatching | unweighted_pymatching |
                                   # belief_matching | union_find |
                                   # tesseract | relay_bp | bposd: the
                                   # real algorithm,
                                   # measured wall clock per window;
                                   # measured_table: relay_bp's answer at a
                                   # GPU's measured time; or a
                                   # number: fixed core latency in us.
                                   # Known number cards: 0.028 = LILLIPUT-class
                                   # core, [d=3, m=2] 7 cycles at 250 MHz
                                   # (2108.06569 sec. 6.3, Table 4).
                                   # A card prices the algorithm stage ONLY;
                                   # fetch and release cycles are separate
  units: 1                         # how many identical decoding engines this
                                   # tier's one chip holds. Each engine has its
                                   # own input memory, and all of them share
                                   # the tier's links. It is gem5's
                                   # FUDesc.count, "number of these FU's
                                   # available" (gem5 src/cpu/FuncUnit.py).
                                   # Hardware holds several engines on a chip
                                   # too: AFS "uses L/N decoder blocks to
                                   # perform error correction over the L
                                   # logical qubits" (2001.06598 lines
                                   # 1049-1052), and Yang et al. instantiate an
                                   # X-type and a Z-type decoder in one FPGA
                                   # (2605.04892 lines 986-988). Each paper
                                   # fixes its count; sweeping it is this
                                   # simulator's own use of the key. The
                                   # chip count is one and is not a key. A job
                                   # that may start takes a free unit with room
                                   # for its rounds: the unit that already holds
                                   # them, else the unit the fewest jobs wait
                                   # on. A job that must wait, for compute or
                                   # for a boundary, is staged with its input on
                                   # the unit with room that has the least work
                                   # left, then the fewest live jobs, then the
                                   # one that already has its rounds. A staged
                                   # job never moves to another unit
                                   # (decoders/decoder_pool.py)
  input: copy                      # copy | in_place: how this tier's unit gets
                                   # the rounds it decodes. copy moves them over
                                   # the tier's input link into the unit's own
                                   # memory, which is what a decoder with
                                   # off-chip input does (Collision Clustering's
                                   # Init unit loads the syndrome into the
                                   # storage elements, 2309.05558 lines
                                   # 268-271). in_place reads them where the
                                   # store keeps them: no link move, no deposit,
                                   # the store's hold kept for the whole decode,
                                   # and the run counts a reference instead of a
                                   # copy (AFS's processing elements "can
                                   # directly access the data stored on-chip",
                                   # 2001.06598 lines 528-531). copy is what
                                   # every hop of this tree does today
  boundary_fold: copy              # copy | in_place: how the window's boundary
                                   # mask reaches the decode. copy duplicates
                                   # the landed input and XORs the mask into the
                                   # duplicate, leaving the unit's rounds raw,
                                   # which is what a software decoder does
                                   # (cuda-q QEC rebuilds the window syndrome
                                   # each time, sliding_window.cpp:287-293).
                                   # in_place XORs it into the unit's own
                                   # memory, which is what a hardware decoder
                                   # does (AFS 2001.06598 lines 528-531; Helios
                                   # keeps its shared memory single-writer,
                                   # 2301.08419 lines 632-640). The mask is
                                   # written once per input, not once per job:
                                   # the two forced-class solves of one window
                                   # read one landed input (decision D2) and one
                                   # boundary, so the solve that starts first
                                   # writes it and the other reads those rounds.
                                   # in_place is refused by name when the tier
                                   # reads its input in place, which leaves it
                                   # no memory of its own to write.
                                   # Only the tier that decodes the plan's
                                   # windows folds a boundary
  result_blocks_unit: false        # false | true: when a finished decode gives
                                   # its unit's compute back. false gives it
                                   # back at the decode's end, because the frame
                                   # manager takes the correction without
                                   # blocking the decoder (Chen 2605.30765 lines
                                   # 1618-1620). true holds the unit until the
                                   # window commits, which is a decoder whose
                                   # output sits in a status register until the
                                   # reader polls it (Riverlane 2410.05202 lines
                                   # 1256-1259); the unit is then busy for the
                                   # output hop and the frame write too. Read on
                                   # the tier that decodes the plan's windows: a
                                   # strong re-decode's result waits in its unit
                                   # until the window side takes it in any case.
                                   # A confidence that forces two class solves
                                   # per window needs a unit per forced class
                                   # under true, because the join reads neither
                                   # solve until both have finished
  unit_memory:                     # the input memory of one decoder unit: a
                                   # window's rounds are copied into it before
                                   # the unit decodes them, and freed when the
                                   # decode ends
    bits: null                     # that memory's capacity in bits, PER UNIT;
                                   # null = no capacity is modelled, a memory
                                   # nothing ever fills. A unit holds a second
                                   # window only when both fit, so the next
                                   # window's rounds load while the current one
                                   # decodes; a window larger than the memory
                                   # stops the run. A bounded memory needs
                                   # rounds that state their size
    word_bits: null                # what one read of that memory moves: the
                                   # fetch reads each round in whole words, one
                                   # word a cycle, beside fetch_cycles_per_job
                                   # and fetch_cycles_per_round (gem5
                                   # src/mem/xbar.cc:135 divCeil; Helios loads
                                   # a byte a clock). null prices no words.
                                   # Refused under input in_place, where the
                                   # store prices the read
  # A row's own keys sit in this section beside the shared keys above
  # (its Settings, decsim/tables.py row_settings), and any other kind
  # refuses them. union_find's two, with their defaults:
  # weight_step: 0.1               # the union_find row's growth resolution: the
                                   # natural-log units of weight one tick of an
                                   # edge length is (Huang, Newman and Brown
                                   # 2004.04693, the precision the weights are
                                   # truncated to). An edge of
                                   # log-odds weight w is round(w / weight_step)
                                   # ticks long, at least one, and under the
                                   # cycle_count below every unit of that length
                                   # is one growth iteration, so this key sets
                                   # the engine's cycles directly. Helios's own
                                   # weights run 2 to 16 (2301.08419 lines
                                   # 1242-1254, the weight resolution wmax).
  # cycle_count: null             # the union_find row's own timing, in place of
                                   # its host wall clock: the decoder's cycle
                                   # count per growth tick, on a named clock.
                                   # null = the wall clock. The count is
                                   #   1
                                   #   + setup_cycles
                                   #   + setup_cycles_per_vertex x detectors
                                   #   + setup_cycles_per_edge x edges
                                   #   + (2 + delay_cycles)
                                   #       x max(1, the growth ticks of every
                                   #              step)
                                   #   + sum over growth steps of
                                   #       max(the step's changes,
                                   #           ceil(cycles_per_edge x its edges
                                   #                x its growth ticks))
                                   #   + delay_cycles + 2
                                   #   + 2 x the depth of the forest it peeled,
                                   # ending on the clock's edge as the stages
                                   # do. The leading 1 is the cycle the counter
                                   # starts at. An iteration of the loop grows
                                   # every front in one cycle, waits
                                   # delay_cycles for that change to reach the
                                   # controller, and decides in one more; a
                                   # unit grows one unit of weight an
                                   # iteration, so a step spanning several
                                   # growth ticks is that many iterations, and
                                   # one quiet iteration runs even for an empty
                                   # syndrome. A step's changes are what its
                                   # fusions ripple through the cluster they
                                   # fused, a level a cycle. A step whose
                                   # closing edges joined no two clusters
                                   # changes nothing. A step that joins clusters
                                   # without moving a parity costs its deepest
                                   # flood, at least one cycle, because only
                                   # roots and the touching flag move. A step that moves a parity costs
                                   # one cycle for the root plus two a level,
                                   # because the parity climbs while the odd
                                   # flag descends. A step's hop count is the
                                   # deepest flood among the clusters it fused
                                   # and its fusion the strongest of them, so
                                   # a step that joins a deep even cluster and
                                   # flips a parity in a shallow one is
                                   # charged at that ceiling. The
                                   # peel pays the delay, a decide cycle, a
                                   # cycle in which every element reports busy
                                   # until its parity flag is set, and two a
                                   # level of the forest it walks. Absent
                                   # fields are 0.
                                   # Helios's row, traced through its register
                                   # transfer level (github.com/yale-paragon/
                                   # Helios_scalable_QEC at 2dda998, the design
                                   # behind 2301.08419v2): a processing element
                                   # per vertex, so a step's work runs inside
                                   # its critical path, and no constant fitted,
                                   #   cycle_count:
                                   #     clock: helios         # 100 MHz
                                   #     delay_cycles: 3       # three registers
                                   #                           # between an
                                   #                           # element and the
                                   #                           # controller
                                   # A unit that walks its edges through a
                                   # memory port sets cycles_per_edge to what
                                   # one boundary edge costs it, the reads the
                                   # edge takes in its layout times the read's
                                   # latency (AFS 2001.06598 lines 536 and
                                   # 1110: four cycles a 32-bit read).
                                   # The setup terms are the floor a unit that
                                   # lays its graph out pays before its first
                                   # step, the vertices reset and the edge
                                   # intervals laid, which Helios, holding its
                                   # graph in registers, does not pay; the
                                   # rounds loaded are the fetch stage below
  engine:
    clock: fridge                  # cycle-priced stages on this clock domain
    fetch_cycles_per_round: 1      # read one round out of decoder memory per
                                   # cycle (LILLIPUT FIFO, sec. 4)
    fetch_cycles_per_job: 0        # what the fetch costs once a job rather than
                                   # once a round. Helios's load is one header
                                   # byte per job, then per round
                                   # ceil(detectors per round / 8) byte cycles
                                   # and one loading cycle (2301.08419v2,
                                   # control_node_single_FPGA.v lines 152-182
                                   # and 239-243 at 2dda998), so its row is 1
                                   # here and that sum above
    release_cycles_per_job: 1      # correction write-out per job (the
                                   # baselines use 10, an experiment card).
                                   # Helios streams three header bytes per job
                                   # (lines 301-323)
    release_cycles_per_round: 0    # what the write-out costs per round. Helios
                                   # shifts the correction down one layer a
                                   # round and streams
                                   # ceil(correction bits per round / 8) bytes
                                   # of it (lines 217-224), so its row is that
                                   # sum here

strong_decoder:                    # the accurate tier: slow, lower LER
  kind: belief_matching
  units: 1
  input: copy                      # copy | in_place, as above; the strong hop
                                   # transfers the assigned data in the paper
                                   # (Toshio 2510.25222 lines 1248-1250), which
                                   # is the copy row
  unit_memory:
    bits: null                     # as above
    word_bits: null                # as above
                                   # a union_find strong tier takes
                                   # weight_step and cycle_count here, as above
  # device: a100                   # the measured_table row's GPU: a100 |
                                   # gh200. Its time is intercept plus slope
                                   # times the iterations decsim's own
                                   # Relay-BP ran, a line measured with
                                   # NVIDIA's nv-qldpc-decoder (cudaq-qec
                                   # 0.8.0) on that GPU, one decode at a time,
                                   # never under the fastest decode measured
                                   # there
                                   # (decoders/measured_table/measurements.py)
  # partition: whole               # how the GPU was shared when measured:
                                   # whole | mps | 3g.40gb | 1g.10gb, the
                                   # last three a100 only; 3g.40gb and
                                   # 1g.10gb are one Multi-Instance GPU
                                   # slice of that NVIDIA profile
  # bases: together                # the measured_table row's BASIS_DECODES
                                   # row: together | apart. apart decodes a
                                   # region's X and Z detectors as two
                                   # smaller models (Relay-BP 2506.01779
                                   # lines 674-700), each observable on its
                                   # own type; the two are two requests to
                                   # the device's queue, priced by parts
                                   # measured on that GPU, and they overlap
                                   # only as far as its capacity lets them
                                   # (decoders/strong_backend.py). A CSS
                                   # circuit only: a detector of neither
                                   # type is refused
  engine:
    clock: room                    # the strong unit lives room-side
    fetch_cycles_per_round: 1
    fetch_cycles_per_job: 0
    release_cycles_per_job: 1
    release_cycles_per_round: 0

decoder_manager:                   # the manager that gives ready windows a unit
  bulk_strong: false               # true serves the strong pool's queued
                                   # re-decodes as one merged decode. Toshio
                                   # 2510.25222 lines 1253-1264 say the strong
                                   # decoder should decode in bulk once the
                                   # boundaries on both sides are determined,
                                   # and that sentence is about one
                                   # escalation's own contiguous rstrong
                                   # region, not about several escalations at
                                   # once; decsim goes past it and merges every
                                   # queued strong job, which is the cheapest
                                   # strong tier a run can be priced against
                                   # and so the floor of the sweep the paper
                                   # leaves open ("could be finely tuned
                                   # depending on the scaling of the decoding
                                   # time and available computational
                                   # resources", 1259-1262). The batch is
                                   # timing-only, since one decode cannot carry
                                   # each member window's correction, so it
                                   # prices a bulk strong tier and refuses a
                                   # run whose accuracy is coupled to the
                                   # strong result; serial escalation only (it
                                   # contradicts escalation.run_both_at_once
                                   # and the double window)
  clock: fridge                    # the domain dispatch_cycles counts in
  dispatch_cycles: 0               # the manager's own work per dispatch,
                                   # charged on its clock after a job is placed
                                   # on a unit and before that job's input is
                                   # asked for. 0 is the default and models
                                   # none of it. Caune et al. arXiv:2410.05202
                                   # lines 519-526 measure 250 to 370 control
                                   # cycles per decode for collecting the
                                   # packets, the bus transfer, the result's
                                   # return and the conditional together, so
                                   # that range bounds this from above

pauli_frame:
  kind: logical_register           # logical_register (FRAMES,
                                   # pauli_frame/pauli_frame.py). The frame a
                                   # correction is committed into: one observable
                                   # bitmask XORed per window.
  clock: fridge
  write_cycles: 1                  # XOR of a correction into the frame register
                                   # (one cycle, XQsim PFU)

idle_policy:
  kind: separate_decode_jobs       # separate_decode_jobs | ignore | extend_stream.
                                   # How an idle patch's rounds are charged; idle
                                   # rounds are decoder workload, since the backlog
                                   # bound counts every generated syndrome bit
                                   # against the decoder's processing rate (Terhal
                                   # 1302.3428 lines 3151-3159; Battistel et al.
                                   # 2303.00054 line 144), so the default costs one
                                   # load-only decode job per idle commit region
                                   # and one shorter job for the rounds left when
                                   # an operation claims the patch or the
                                   # workload completes.
                                   # ignore is the optimistic card for active-path
                                   # latency studies. Inert while the workload is a
                                   # single always-busy operation.

magic_state_factory:
  kind: infinite                   # infinite | distillation | multi_level
                                   # (MAGIC_STATE_FACTORIES, qpu/settings.py):
                                   # where an operation that needs a magic
                                   # state gets it. infinite always has one in
                                   # stock. distillation is one 15-to-1 stage
                                   # (Litinski 1905.06903 Sec. 4) whose eleven
                                   # correction decodes per state compete with
                                   # the core's windows for the decoder; its
                                   # keys are unit_count, attempt_ticks and
                                   # correction_round_count (no default),
                                   # correction_decode_count (11),
                                   # return_ticks (0), success_probability
                                   # (1.0), seed, initial_store (0),
                                   # production_mode (demand | continuous) and
                                   # buffer_capacity; the two durations are
                                   # engine ticks. multi_level is Silva et al.'s
                                   # chain (2411.04270 Sec. II B): levels, a
                                   # list of {unit_count, distance,
                                   # logical_cycles_per_round (13 at the first
                                   # level, 15 above), success_probability},
                                   # and inputs_per_round (15),
                                   # outputs_per_round (1),
                                   # preparation_unit_count (1),
                                   # preparation_logical_cycles (2),
                                   # preparation_distance (3),
                                   # preparation_success_probability (1.0),
                                   # correction_round_count (0),
                                   # correction_decode_count (0), seed,
                                   # production_mode and buffer_capacity. A
                                   # memory workload asks for no state, so
                                   # the row is inert here

observation:                       # what a run records beyond its results
  check_windows_with: none         # none | tesseract. tesseract re-decodes every
                                   # window with the official Tesseract backend and
                                   # counts disagreements in the owned observable
                                   # contribution; never latency-priced. A window is
                                   # a d-round problem at any shot length, so this
                                   # holds at every distance (9.6 ms/window at d=9,
                                   # 18.1 ms at d=11).
  log_component_io: false          # true adds component I/O lines to the trace:
                                   # what each store and unit received, holds
                                   # (rounds, residents), and emitted
  log: off                         # off | print | file | both. The engine narrator:
                                   # print shows it live on screen; file writes each
                                   # shot's full line record to the run folder,
                                   # results/<stamp>-<name>/log/, one file per shot
                                   # named p<p>_d<d>_algo<card>_round<T>us_seed<n>.log;
                                   # both does both. results/ is not tracked
  trace: chrome                    # off | chrome | <path>. The Chrome trace of the
                                   # data path: where every round and window sat, for
                                   # how long, and whether each hop copied the bits or
                                   # referenced them. chrome writes one file per traced
                                   # shot next to the results; a path writes there
                                   # instead (.gz compresses). Opens in Perfetto or
                                   # chrome://tracing. It costs one file per traced
                                   # shot, holding every hop of every round and window
                                   # of that shot: 69 kB for this file's d3, 15-round
                                   # point, growing with the rounds and windows a shot
                                   # has. `decsim collect` draws timeline.png from it,
                                   # and `decsim trace follow` reads one round's or
                                   # window's path out of it. `decsim collect` also
                                   # reads the traced shots back into residence.csv:
                                   # how long a round or window sat in each store and
                                   # unit memory, and how long a move waited on each
                                   # link path
  trace_shots: [0]                 # the shots the trace is written for; a sweep point
                                   # of 2000 shots writes one file, not 2000
  record_switching_windows: false  # true keeps every decode request and service record
                                   # for the switching study's per-window rows
  syndrome_buffer_occupancy: false # true samples the weak syndrome buffer's
                                   # held-round count at every change: the
                                   # buffer's occupancy over time
  backlog_trace: false             # true samples the undecoded-round backlog after
                                   # every action: the backlog over time, as a step function
  decoder_memory_occupancy: false  # true samples each unit memory's held-bit count,
                                   # for a sweep over unit_memory.bits
  data_movement: false             # true counts the copies, references and moves of
                                   # every round, and the most raw bits each
                                   # forming seat's former held
                                   # (detection_events), on the RunResult without
                                   # the trace, and writes the counts to the run
                                   # folder:
                                   # shot_data_movement.csv, one row per shot per path,
                                   # and data_movement.csv, the point's mean over shots
                                   # by path and then by memory class. false writes
                                   # neither file, because a run that counted nothing
                                   # has no counts and a row of zeros would say
                                   # otherwise
