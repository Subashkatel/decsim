# The strong tier's LER sweep (plot 1). Runs with `decsim collect`;
# every key is documented in reference.yaml. Shot counts sized from the
# pilot cost table: >= 100 failures where reachable, ~400 core-hours
# total; sub-threshold points at d >= 7 plot as upper bounds.
#
# 1.4 M shots outlast one job: a 16 h job runs 16 h / (seconds per
# shot), 262,000 at the weak card's 0.22 s at d7, and belief matching
# is slower. On a cluster, `decsim plan` cuts the sweep into rounds of
# pieces, slurm/round.sh submits each round and `decsim status` folds
# them (docs/how-to/run_a_sweep_on_slurm.md).

extends: strong_decoder_baseline.yaml

sweep:
  - axes:
      workload.arguments.physical_error_probability: [0.005, 0.007, 0.01]
      qpu.distance: [3, 5, 7, 9, 11]
      qpu.round_period_microseconds: [1.0]
    collection: {max_shots: 5000}
  - axes:
      workload.arguments.physical_error_probability: [0.003]
      qpu.distance: [3, 5, 7, 9, 11]
      qpu.round_period_microseconds: [1.0]
    collection: {max_shots: 20000}
  - axes:
      workload.arguments.physical_error_probability: [0.002]
      qpu.distance: [3, 5, 7, 9, 11]
      qpu.round_period_microseconds: [1.0]
    collection: {max_shots: 50000}
  - axes:
      workload.arguments.physical_error_probability: [0.0005, 0.001]
      qpu.distance: [3, 5, 7, 9, 11]
      qpu.round_period_microseconds: [1.0]
    collection: {max_shots: 100000}
