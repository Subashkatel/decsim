# The weak tier's LER sweep (plot 1). Runs with `decsim collect`;
# every key is documented in reference.yaml. Shot counts sized from the
# pilot cost table: >= 100 failures where reachable, ~350 core-hours
# total; d 9 and 11 at the two lowest p plot as upper bounds.
#
# 10.4 M shots outlast one job: at 0.22 s per shot at d7 a 16 h job
# runs 262,000 shots. `decsim collect` saves each piece the moment it
# ends, so the same job submitted again runs only the pieces it lacks
# (docs/how-to/run_a_sweep_on_slurm.md).

extends: weak_decoder_baseline.yaml

sweep:
  - axes:
      workload.arguments.physical_error_probability: [0.005, 0.007, 0.01]
      qpu.distance: [3, 5, 7, 9, 11]
      qpu.round_period_microseconds: [1.0]
    shots: 5000
  - axes:
      workload.arguments.physical_error_probability: [0.003]
      qpu.distance: [3, 5, 7, 9, 11]
      qpu.round_period_microseconds: [1.0]
    shots: 20000
  - axes:
      workload.arguments.physical_error_probability: [0.002]
      qpu.distance: [3, 5, 7, 9, 11]
      qpu.round_period_microseconds: [1.0]
    shots: 50000
  - axes:
      workload.arguments.physical_error_probability: [0.0005, 0.001]
      qpu.distance: [3, 5, 7, 9, 11]
      qpu.round_period_microseconds: [1.0]
    shots: 1000000
