# Baseline closed loop: the single source of every parameter of the experiment.
# Every number that costs simulated time carries its source next to it.

code_task: surface_code:rotated_memory_z     # stim generator task (real detector data)
distance: 3
rounds_per_shot: 60                          # QEC rounds per shot
windowing:
  scheme: sliding                            # sliding | parallel | sandwich | naive_online (no windowing: one decode per operation after all rounds)
  commit_rounds: null                        # rounds committed per window; null = d
  buffer_rounds: null                        # look-ahead rounds per window; null = d

# The sweep: every point is the cross product of the three axes, `shots` runs each (seeds 0..shots-1).
# Every shot reports timing and whether the logical prediction was wrong, so:
#   timing only:   one physical_error_probability, few shots (10)
#   LER only:      one round_period_us, one algorithm_latency_us, many shots (200+), several probabilities
#   both:          all axes, many shots
sweep:
  physical_error_probability: [0.001]        # p on every physical operation, as Stim's guide and sinter do: after_clifford_depolarization,
                                             # before_round_data_depolarization, before_measure_flip_probability, after_reset_flip_probability
  round_period_us: [1.0, 0.5, 0.2, 0.1, 0.05, 0.02]   # input round period, the QEC cycle time seen by the controller
  algorithm_latency_us: [0.028, 0.28, measured]       # weak decoder algorithm latency per window, or "measured":
                                             # 0.028 = LILLIPUT [d=3, m=2] 7 cycles at 250 MHz, 2108.06569 sec. 6.3 and Table 4 (ASIC card)
                                             # measured = wall clock of each real PyMatching call on this host (software decoder)
  shots: 10

controller:
  t_binary_availability_us: 0.0              # pulses to binary; zero: readout classification is inside the priced round (Google 2023 Nature 614 sec. Methods)
  t_pack_us: 0.0                             # one fragment per round makes packing a no-op (StimDevice emits one fragment)
links:                                       # one card per path: propagation latency and capacity (null = unbounded, propagation only)
  # on the baseline path
  qc:  {latency_us: 0.15, bits_per_us: null}  # QPU -> controller, one readout
  c2b: {latency_us: 0.10, bits_per_us: 1000.0} # controller -> Buffer 0, one round
  cwd: {latency_us: 2.0,  bits_per_us: null}  # Buffer 0 -> weak decoder memory, one window
  dd:  {latency_us: 0.5,  bits_per_us: null}  # decoder -> decoder boundary handoff
  wdo: {latency_us: 1.0,  bits_per_us: null}  # weak decoder -> Pauli frame
  
  # not on the baseline path (releases and the strong tier): null = the logical_reference card's numbers
  oc:  null                                   # Pauli frame -> controller, a release
  cq:  null                                   # controller -> QPU, an instruction
  wsd: null                                   # weak -> strong escalation
  csd: null                                   # controller -> strong decoder
  do:  null                                   # strong decoder -> Pauli frame

decoder:
  units: 1                                   # one weak ASIC
  engine:
    frequency_mhz: 250.0                     # LILLIPUT [d=3,m=2] FPGA clock, 2108.06569 Table 4
    fetch_cycles_per_round: 1                # read one round out of decoder memory per cycle (LILLIPUT syndrome FIFO, sec. 4)
    release_cycles_per_job: 1                # correction register write-out; one cycle, experiment card
decoder_memory_rounds: null                  # rounds of input memory PER DECODER UNIT; null = unbounded (baseline: infinite buffers)

pauli_frame:
  commit_us: 0.004                           # one 250 MHz cycle to XOR the correction into the frame register (XQsim PFU precedent)

report_dir: experiments/results/baseline_closed_loop
