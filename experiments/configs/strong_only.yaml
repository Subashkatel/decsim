# Strong only closed loop: every window decoded once, on the strong tier.
# Rounds dual-write at packing; syndrome buffer 1 is the store the strong
# path reads (Buffer 0 drops on arrival), sbd carries the input, do the result.

mode: strong_only

code_task: surface_code:rotated_memory_z
distance: 3
rounds_per_shot: 20
windowing:
  scheme: sliding                            # sliding | parallel | sandwich | naive_online
  commit_rounds: null                        # null = d
  buffer_rounds: null                        # null = d

sweep:
  # timing: strong cards are slow; the round periods bracket where one unit stops keeping up
  - physical_error_probability: [0.001]
    round_period_us: [10.0, 5.0, 3.0, 2.0, 1.5, 1.0, 0.5]
    algorithm_latency_us: [5.0, 1.0, measured]
                                             # 5.0 = the repository's strong-tier reference card (accuracy-first
                                             #       decoder, no hardware source; the axis to sweep)
                                             # 1.0 = faster-strong sensitivity card
                                             # measured = wall clock of each real PyMatching call on this host
    shots: 10
  # logical error rate: timing knobs never change the decoded answer (Gate 10)
  - physical_error_probability: [0.001, 0.002, 0.003, 0.005, 0.007, 0.01]
    round_period_us: [1.0]
    algorithm_latency_us: [5.0]
    shots: 200

controller:
  t_binary_availability_us: 0.0
  t_pack_us: 0.0

clocks:                            # clock domain name -> MHz; a link prices its
                                   # cycles on the domain it names. More domains
                                   # (an mK stage, a 4K SFQ decoder) are one more
                                   # entry here. Both start at LILLIPUT's 250 MHz
                                   # ([d=3,m=2] FPGA clock, 2108.06569 Table 4).
  fridge: 250.0
  room: 250.0

links:
  # on the strong-only path; the crossing and the strong side price on the
  # room clock, the fridge side on the fridge clock; every interconnect
  # starts at 1 cycle, unbounded bandwidth (2026-08-26 directive)
  qc:  {latency_cycles: 1, clock: fridge, bits_per_cycle: null}  # QPU -> controller, one readout
  cwb: {latency_cycles: 1, clock: fridge, bits_per_cycle: null}  # controller -> Buffer 0 (the weak buffer), one round (dropped on arrival)
  csb: {latency_cycles: 1, clock: room, bits_per_cycle: null}    # controller -> syndrome buffer 1 (the strong buffer), one round; the store that wakes windows
  sbd: {latency_cycles: 1, clock: room, bits_per_cycle: null}    # syndrome buffer 1 -> strong decoder memory, one window
  dd:  {latency_cycles: 1, clock: room, bits_per_cycle: null}    # decoder -> decoder boundary handoff
  do:  {latency_cycles: 1, clock: room, bits_per_cycle: null}    # strong decoder -> Pauli frame
  # not on this path: null = the logical_reference card's numbers
  wbd: null
  wdo: null
  wsd: null
  oc:  null

buffers:                                     # syndrome-path store capacities, in rounds (null = unbounded)
  buffer_0_size: null                        # Buffer 0 (rounds drop on arrival in this mode)
  buffer_1_size: null                        # syndrome buffer 1, the store this path reads
  packing_workspace_size: null               # packing assembly workspace

decoder:
  units: 1                                   # strong units; sweep by editing (stability runs used 1, 2, 4)
  unit_buffer_size: null                     # input SRAM rounds PER UNIT; null = unbounded
  engine:
    frequency_mhz: 250.0
    fetch_cycles_per_round: 1
    release_cycles_per_job: 10


pauli_frame:
  commit_us: 0.004
