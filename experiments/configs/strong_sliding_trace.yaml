# Strong baseline, sliding windows, with the engine narrator on: one timing
# point so the trace stays readable. Timeline plot comes from seed 0.
extends: strong_only.yaml

rounds_per_shot: 20

sweep:
  - physical_error_probability: [0.001]
    round_period_us: [1.0]                   # the load ~ 0.5 operating point
    algorithm_latency_us: [1.00]            # LILLIPUT-class card
    shots: 1

trace: file
trace_io: false                                  # full line record per shot in
                                             # results/strong_sliding_trace/trace/
