# Weak baseline closed loop: the single source of every parameter.
# Every number that costs simulated time carries its source next to it.

mode: weak_baseline                          # decode path: rounds -> Buffer 0 -> weak decoder -> frame

code_task: surface_code:rotated_memory_z     # stim generator task (real detector data)
distance: 3
rounds_per_shot: 60                          # QEC rounds per shot
windowing:
  scheme: sliding                            # sliding | parallel | sandwich | naive_online
  commit_rounds: null                        # rounds committed per window; null = d
  buffer_rounds: null                        # look-ahead rounds per window; null = d

# The sweep: a list of blocks. Each block is the cross product of its three axes, `shots` runs
# per point (seeds 0..shots-1); a point and seed named by two blocks runs once. Blocks put
# shots where they matter: the timing block sweeps many timing points with few shots, the LER
# block sweeps several probabilities with many shots at one timing point (timing knobs never
# change the decoded answer, Gate 10, so LER needs only one timing point).
sweep:
  # timing: every round period and decoder card, few shots
  - physical_error_probability: [0.001]      # p on every physical operation, as Stim's guide and sinter do
    round_period_us: [10.0, 5.0, 2.0, 1.0, 0.9, 0.85, 0.8, 0.5, 0.2, 0.1, 0.05, 0.02]
                                             # input round period, slow to fast; 0.9/0.85/0.8 bracket
                                             # the load = 1 knee of the 0.028 card
    algorithm_latency_us: [0.028, 0.28, pymatching]
                                             # a number: fixed core latency in us; a name: the real algorithm
                                             # A card prices the algorithm stage ONLY; fetch and release cycles
                                             # are charged separately below.
                                             # 0.028 = LILLIPUT-class core: [d=3, m=2] 7 cycles at 250 MHz,
                                             #         2108.06569 sec. 6.3 and Table 4
                                             # 0.28  = 10x sensitivity card (no separate hardware source)
                                             # pymatching = real MWPM per window, measured wall clock on this host
    shots: 10
  # logical error rate: several probabilities, one timing point, many shots (Wilson 95% on the plot)
  - physical_error_probability: [0.001, 0.002, 0.003, 0.005, 0.007, 0.01]
    round_period_us: [1.0]
    algorithm_latency_us: [0.028]
    shots: 200

controller:                                  # controller work per round, in fridge cycles
  clock: fridge
  t_binary_availability_cycles: 0            # pulses to binary; zero: classification is inside the priced round
                                             # (Google 2023 Nature 614 sec. Methods)
  t_pack_cycles: 0                           # one fragment per round makes packing a no-op (StimDevice)

clocks:                            # clock domain name -> MHz; a link prices its
                                   # cycles on the domain it names. More domains
                                   # (an mK stage, a 4K SFQ decoder) are one more
                                   # entry here. Both start at LILLIPUT's 250 MHz
                                   # ([d=3,m=2] FPGA clock, 2108.06569 Table 4).
  fridge: 250.0
  room: 250.0

links:                                       # one card per path, in cycles of its named clock
                                             # domain (see clocks:); every interconnect starts at
                                             # 1 cycle, unbounded bandwidth (2026-08-26 directive)
  # on the baseline path (all fridge-side)
  qc:  {latency_cycles: 1, clock: fridge, bits_per_cycle: null}  # QPU -> controller, one readout
  cwb: {latency_cycles: 1, clock: fridge, bits_per_cycle: null}  # controller -> Buffer 0 (the weak buffer), one round
  wbd: {latency_cycles: 1, clock: fridge, bits_per_cycle: null}  # Buffer 0 -> weak decoder memory, one window
  dd:  {latency_cycles: 1, clock: fridge, bits_per_cycle: null}  # decoder -> decoder boundary handoff
  wdo: {latency_cycles: 1, clock: fridge, bits_per_cycle: null}  # weak decoder -> Pauli frame
  # not on this path: null = the logical_reference card's numbers
  csb: null                             # controller -> syndrome buffer 1 (the strong buffer)
  oc:  null                                  # Pauli frame -> controller, a release
  cq:  null                                  # controller -> QPU, an instruction
  wsd: null                                  # weak -> strong escalation
  sbd: null                                  # syndrome buffer 1 -> strong decoder memory, one window

buffers:                                     # syndrome-path store capacities, in rounds (null = unbounded)
  buffer_0_size: null                        # Buffer 0, the upstream round store
  buffer_1_size: null                        # syndrome buffer 1 (unused on this path)
  packing_workspace_size: null               # packing assembly workspace

decoder:
  units: 1                                   # one weak ASIC
  unit_buffer_size: null                     # input SRAM rounds PER UNIT; null = unbounded
  engine:
    frequency_mhz: 250.0                     # LILLIPUT [d=3,m=2] FPGA clock, 2108.06569 Table 4
    fetch_cycles_per_round: 1                # read one round out of decoder memory per cycle (LILLIPUT FIFO, sec. 4)
    release_cycles_per_job: 10               # correction register write-out, experiment card


pauli_frame:
  clock: fridge
  commit_cycles: 1                           # one cycle to XOR the correction into the frame (XQsim PFU)
