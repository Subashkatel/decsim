# The weak tier's offline LER sweep (plot 1). Runs through
# experiments.offline_run; every key is documented in reference.yaml.
# Shot counts sized from the 2026-08-27 pilot cost table: >= 100
# failures where reachable, ~350 core-hours total; d 9 and 11 at the
# two lowest p plot as upper bounds.

extends: weak_decoder_baseline.yaml

sweep:
  - physical_error_probability: [0.005, 0.007, 0.01]
    distance: [3, 5, 7, 9, 11]
    round_period_us: [1.0]
    shots: 5000
  - physical_error_probability: [0.003]
    distance: [3, 5, 7, 9, 11]
    round_period_us: [1.0]
    shots: 20000
  - physical_error_probability: [0.002]
    distance: [3, 5, 7, 9, 11]
    round_period_us: [1.0]
    shots: 50000
  - physical_error_probability: [0.0005, 0.001]
    distance: [3, 5, 7, 9, 11]
    round_period_us: [1.0]
    shots: 1000000
