# Weak baseline, sliding windows, with the engine narrator on: one timing
# point so the trace stays readable. Timeline plot comes from seed 0.
extends: weak_baseline.yaml

sweep:
  - physical_error_probability: [0.001]
    round_period_us: [1.0]                   # the load ~ 0.5 operating point
    algorithm_latency_us: [0.028]            # LILLIPUT-class card
    shots: 2

trace: file                                  # full line record per shot in
                                             # results/weak_sliding_trace/trace/
