# Deterministic analytical-oracle case.
#
# Purpose:
#   Verify the exact baseline event ordering and timing, not performance or LER.
#   This case intentionally has:
#     - zero physical noise,
#     - one fixed decoder latency,
#     - one decoder unit,
#     - unbounded link bandwidth,
#     - only 12 QEC rounds, which produce exactly 3 sliding windows.
#
# Expected analytical results are provided beside this file.

code_task: surface_code:rotated_memory_z
distance: 3
rounds_per_shot: 12

windowing:
  scheme: sliding
  commit_rounds: 3
  buffer_rounds: 3

sweep:
  # p = 0 exactly cannot run: a noiseless circuit has an empty detector error
  # model and no matching graph. 1.0e-9 samples zero defects on every shot and
  # every timing tick is identical to p = 0 (preset stage costs, payload sizes
  # independent of p).
  - physical_error_probability: [1.0e-9]
    round_period_us: [1.0]
    algorithm_latency_us: [0.028]
    shots: 1

controller:
  t_binary_availability_us: 0.0
  t_pack_us: 0.0

links:
  # null bandwidth means unbounded: propagation latency only.
  qc:  {latency_us: 0.15, bits_per_us: null}
  c2b: {latency_us: 0.10, bits_per_us: null}
  cwd: {latency_us: 2.00, bits_per_us: null}
  dd:  {latency_us: 0.50, bits_per_us: null}
  wdo: {latency_us: 1.00, bits_per_us: null}

  # Unused by this weak-only baseline. null keeps the repository reference card.
  oc:  null
  cq:  null
  wsd: null
  csd: null
  do:  null

decoder:
  units: 1
  engine:
    frequency_mhz: 250.0
    fetch_cycles_per_round: 1
    release_cycles_per_job: 1

decoder_memory_rounds: null

pauli_frame:
  commit_us: 0.004

report_dir: experiments/results/analytic_oracle_d3_r12
