# Small deterministic hand-check using ONLY the fields already supported by
# experiments/baseline/baseline_closed_loop.py.
#
# Purpose:
#   Run one valid real-Stim example through:
#   QPU -> QC -> controller binary availability -> C2B -> Buffer 0
#   -> sliding windows -> CWD -> decoder memory -> fetch -> algorithm
#   -> release -> DD/WDO -> Pauli frame.
#
# Important:
#   StimDevice emits one fragment per round, so packing is intentionally a
#   zero-cost no-op in this existing baseline. No new YAML field is added.

code_task: surface_code:rotated_memory_z
distance: 3
rounds_per_shot: 9

windowing:
  scheme: sliding
  commit_rounds: null
  buffer_rounds: null

sweep:
  # p = 0 exactly cannot run: a noiseless circuit has an empty detector error
  # model and no matching graph. 1.0e-9 samples zero defects and every timing
  # tick is identical to p = 0.
  - physical_error_probability: [1.0e-9]
    round_period_us: [0.5]
    algorithm_latency_us: [0.028]
    shots: 1

controller:
  # Nonzero so the controller processing stage is visible in the trace.
  t_binary_availability_us: 0.1

  # One fragment per round means packing is a no-op in the existing runner.
  t_pack_us: 0.0

links:
  qc:
    latency_us: 1.0
    bits_per_us: null

  c2b:
    latency_us: 0.5
    bits_per_us: 100000.0

  cwd:
    latency_us: 1.0
    bits_per_us: null

  dd:
    latency_us: 0.5
    bits_per_us: null

  wdo:
    latency_us: 1.0
    bits_per_us: null

  oc: null
  cq: null
  wsd: null
  csd: null
  do: null

decoder:
  units: 1
  engine:
    frequency_mhz: 250.0
    fetch_cycles_per_round: 1
    release_cycles_per_job: 1

# Each window reads exactly 6 rounds. This makes decoder-side memory finite
# and exactly large enough for one window.
decoder_memory_rounds: 6

pauli_frame:
  commit_us: 0.004

report_dir: experiments/results/baseline_closed_loop_hand_check
