# The pipelined small run: the same whole-number card as small_run.yaml,
# but rounds every 1 us instead of 3, so windows arrive every 3 us while the
# serial decode chain needs 7 us per window (dd 1 + cwd 1 + fetch 3 +
# algorithm 1 + release 1). The loop saturates: while the engine decodes
# window k, window k-1's correction is riding the wdo link and window k+1
# is already queued with its data in Buffer 0. Every stage of the path is
# busy with a different window at the same time, which is the pipelining;
# the price is a dependency wait that grows by 4 us per window.
#
#   window 0: ready  8, dispatch  8, done 14, commit 16, reaction  8
#   window 1: ready 11, dispatch 15, done 21, commit 23, reaction 12
#   window 2: ready 14, dispatch 22, done 28, commit 30, reaction 16

code_task: surface_code:rotated_memory_z
distance: 3
rounds_per_shot: 12

windowing:
  scheme: sliding
  commit_rounds: 3
  buffer_rounds: 3

sweep:
  - physical_error_probability: [1.0e-9]
    round_period_us: [1.0]
    algorithm_latency_us: [1.0]
    shots: 1

controller:
  t_binary_availability_us: 0.0
  t_pack_us: 0.0

links:
  qc:  {latency_us: 1.0, bits_per_us: null}
  c2b: {latency_us: 1.0, bits_per_us: null}
  cwd: {latency_us: 1.0, bits_per_us: null}
  dd:  {latency_us: 1.0, bits_per_us: null}
  wdo: {latency_us: 1.0, bits_per_us: null}

  oc:  null
  cq:  null
  wsd: null
  csd: null
  do:  null

decoder:
  units: 1
  engine:
    frequency_mhz: 2.0
    fetch_cycles_per_round: 1
    release_cycles_per_job: 2

decoder_memory_rounds: null

pauli_frame:
  commit_us: 1.0
