# A realistic run: d=7, 600 syndrome rounds, p = 1e-4, latencies from the
# literature. Every number carries its source. Everything not named here
# comes from the baseline yaml (LILLIPUT 250 MHz engine cycle for fetch and
# release, arXiv:2108.06569 Table 4; frame commit 0.004 us, XQsim PFU
# precedent; t_binary_availability 0, readout classification priced inside
# the round, Google Nature 614, 676 (2023) Methods).
#
# The decode chain per 14-round window with this card:
#   service = cwd 2.0 + fetch 14 x 0.004 + algorithm 0.81 + release 0.004 = 2.87 us
#   chain   = service + dd 0.5 = 3.37 us
# and a window arrives every 7 x round_period, so the knee sits at
#   round_period = 3.37 / 7 = 0.481 us  (input frequency 2.08 rounds/us).
# At the hardware cycle of 1.1 us the load is 0.44: comfortably keeping up.

extends: ../../experiments/baseline/baseline_closed_loop.yaml

distance: 7                     # Google's below-threshold processor is d=7
                                # (Nature 638, 920 (2025), arXiv:2408.13687)
rounds_per_shot: 600            # long shots: 85 sliding windows each

sweep:
  # p = 1e-4: requested operating point, one order below today's hardware
  # (physical error rates near 1e-3 in Nature 638, 920 (2025))
  - physical_error_probability: [0.0001]
    # centered on the 1.1 us QEC cycle of Nature 638, 920 (2025),
    # arXiv:2408.13687; the faster points bracket the 0.481 us knee
    round_period_us: [2.2, 1.65, 1.32, 1.1, 0.9, 0.8, 0.7, 0.6, 0.55, 0.5,
                      0.48, 0.45, 0.4, 0.35]
    # 0.81 us per window: Riverlane's Collision Clustering decoder decodes
    # an 881-qubit (d=21) surface code in 810 ns on FPGA (Barber et al.,
    # arXiv:2309.05558); carded here as the algorithm core of a d=7 window
    algorithm_latency_us: [0.81]
    shots: 2                    # ~36 s per shot at d=7, 600 rounds

links:
  # qc, cwd, dd, wdo: Khalid et al. Table II, the repository's
  # logical_reference card (decsim/links/link_profiles.py)
  qc:  {latency_us: 0.15, bits_per_us: null}   # Khalid Table II qc effective time
  c2b: {latency_us: 0.10, bits_per_us: null}   # repository choice: controller
                                               # to Buffer 0 hop; no external source
  cwd: {latency_us: 2.0,  bits_per_us: null}   # Khalid Table II cd latency
  dd:  {latency_us: 0.5,  bits_per_us: null}   # Khalid Table II dd
  wdo: {latency_us: 1.0,  bits_per_us: null}   # Khalid Table II do, weak output

  oc:  null
  cq:  null
  wsd: null
  csd: null
  do:  null

report_dir: guide/walkthrough/results_realistic
