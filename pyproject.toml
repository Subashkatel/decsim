[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decsim"
version = "0.1.0"
description = "QEC control/decoding simulator package scaffold"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
stim = ["stim"]
pymatching = ["pymatching"]
experiments = ["stim", "pymatching", "numpy", "scipy", "matplotlib"]
bb-experiments = ["quits==1.1.0", "relay-bp==0.2.2", "tesseract-decoder==0.1.1.dev20260802231159"]

# Flat layout: the decsim/ package sits at the repo root. Discover it (and its
# subpackages decsim.adapters / decsim.frontends) from there. No package-dir remap.
[tool.setuptools.packages.find]
where = ["."]
include = ["decsim*"]

# (decsim.qpu.stimcircuits is Apache-2.0 / Oscar Higgott; the license must travel with it).
[tool.setuptools.package-data]
"decsim.qpu.stimcircuits" = ["LICENSE", "NOTICE.md"]

# docs/ holds cloned third-party artifacts (e.g. the SWIPER repo) whose own
# test suites must not be collected by our `python -m pytest -q` entry point.
[tool.pytest.ini_options]
testpaths = ["tests", "experiments/tests"]
