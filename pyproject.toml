[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decsim"
version = "0.1.0"
description = "QEC control/decoding simulator package scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
decsim = "decsim.experiments.command:main"

[project.optional-dependencies]
stim = ["stim"]
pymatching = ["pymatching"]
# The yaml layer reads PyYAML, and the decoder table imports ldpc for its
# BP-OSD and belief matching rows.
run = ["stim", "pymatching", "numpy", "scipy", "matplotlib", "pyyaml", "ldpc"]
deltakit = [
    "stim",
    "deltakit-explorer==0.9.2",
    "deltakit-circuit==0.9.1",
    "deltakit-core==0.9.1",
    "deltakit-decode==0.9.1",
    "deltakit-stim==0.2.5",
]
# The suite and the referees it checks decsim against (sinter's decoders,
# beliefmatching, qLDPC's sliding windows, Ciw's blocking queue), at the
# versions it passes on; the tests cite their source lines at these.
test = ["pytest==9.1.1", "sinter==1.16.0", "beliefmatching==0.2.0", "qldpc==0.3.3", "ciw==3.2.7"]
# The style gate tools/check.sh runs, at the ruff whose rules STYLE.md reads.
dev = ["ruff==0.16.5"]
bb-decoders = ["quits==1.1.0", "relay-bp==0.2.2", "tesseract-decoder==0.1.1.dev20260802231159"]

# Flat layout: the decsim/ package sits at the repo root. Discover it and every
# subpackage (decsim.experiments, decsim.decoders, ...) from there. No
# package-dir remap.
[tool.setuptools.packages.find]
where = ["."]
include = ["decsim*"]

# tests/ is the whole suite, and the only place with tests: `python -m pytest
# -q` collects it and nothing else. docs/ holds the documentation, in the
# Diataxis scheme, and docs/README.md is its front door.
[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest's own default skips any folder named "build" when it walks a
# tree, which silently dropped tests/build/ from the suite; the list
# below is that default without "build".
norecursedirs = [".*", "*.egg", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}"]

# The style gate (STYLE.md rule 9): Google Python style, 80
# columns, Google docstrings. The one-action rule of rule 1 is checked
# separately by tools/check_one_action.py.
[tool.ruff]
line-length = 80
target-version = "py310"
extend-exclude = [
    ".pydeps",
    ".venv",
    "tmp",
    "archive",
    "results",
]

[tool.ruff.lint]
# SIM is off on purpose: it asks for inline conditionals and merged
# conditions, the opposite of STYLE.md rule 1.
select = ["E", "W", "F", "N", "D", "B", "I", "UP", "ARG"]
ignore = [
  "D105",  # magic methods need no docstring
  "D107",  # __init__ is described by the class docstring
  "D203",  # no blank line before a class docstring
  "D213",  # summary on the first line
  "UP007", # Optional[X] stays, the form the package is written in
  "UP045", # same
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["decsim", "tests"]

[tool.ruff.lint.per-file-ignores]
# A test module keeps its docstring (it names the source it checks
# against); test functions and helper classes need none.
"tests/**" = ["D101", "D102", "D103", "D104"]
