[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decsim"
version = "0.1.0"
description = "QEC control/decoding simulator package scaffold"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
decsim = "decsim.front.command:main"

[project.optional-dependencies]
stim = ["stim"]
pymatching = ["pymatching"]
run = ["stim", "pymatching", "numpy", "scipy", "matplotlib"]
bb-decoders = ["quits==1.1.0", "relay-bp==0.2.2", "tesseract-decoder==0.1.1.dev20260802231159"]

# Flat layout: the decsim/ package sits at the repo root. Discover it and every
# subpackage (decsim.front, decsim.decoders, ...) from there. No package-dir
# remap.
[tool.setuptools.packages.find]
where = ["."]
include = ["decsim*"]

# tests/ is the whole suite, and the only place with tests: `python -m pytest
# -q` collects it and nothing else. docs/ holds the four pages a reader
# starts from (architecture, glossary, plug_in_a_component, reading_a_trace).
[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest's own default skips any folder named "build" when it walks a
# tree, which silently dropped tests/build/ from the suite; the list
# below is that default without "build".
norecursedirs = [".*", "*.egg", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}"]

# The style gate (STYLE.md rule 9): Google Python style, 80
# columns, Google docstrings. The one-action rule of rule 1 is checked
# separately by tools/check_one_action.py.
[tool.ruff]
line-length = 80
target-version = "py39"
# tests/data holds the frozen QLX artifacts and the scripts that
# produced them inside the QLX container. They are provenance, not
# decsim code, and are kept exactly as they ran.
extend-exclude = [
    ".pydeps",
    ".venv",
    "tmp",
    "archive",
    "results",
    "tests/data",
]

[tool.ruff.lint]
# SIM is off on purpose: it asks for inline conditionals and merged
# conditions, the opposite of STYLE.md rule 1.
select = ["E", "W", "F", "N", "D", "B", "I", "UP", "ARG"]
ignore = [
  "D105",  # magic methods need no docstring
  "D107",  # __init__ is described by the class docstring
  "D203",  # no blank line before a class docstring
  "D213",  # summary on the first line
  "UP007", # Optional[X] stays readable and runs on 3.9
  "UP045", # same
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["decsim", "tests"]

[tool.ruff.lint.per-file-ignores]
# A test module keeps its docstring (it names the source it checks
# against); test functions and helper classes need none.
"tests/**" = ["D101", "D102", "D103", "D104"]
