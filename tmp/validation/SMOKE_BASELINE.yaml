schema_version: 1
interpreter:
  executable: /usr/bin/python
  implementation: CPython
  version: 3.9.25
rationale:
  workload: The workload is constructed inline from reviewed core Operation records
    so the integration gate has no frontend dependency.
  trust: The owner declared the legacy frontend untrusted, so its workload cannot
    underpin smoke verification.
  supersession: This workload intentionally establishes a new metric baseline. The
    old frontend-derived metric is superseded rather than treated as a regression
    comparator.
snapshot:
  workload:
    operations:
    - id: 0
      name: prepare patch 0
      qubits:
      - 0
      patches:
      - 0
      predecessors: []
      kind: MEMORY
    - id: 1
      name: merge patches 0 and 1
      qubits:
      - 0
      - 1
      patches:
      - 0
      - 1
      predecessors:
      - 0
      kind: MERGE
    - id: 2
      name: measure patch 1
      qubits:
      - 1
      patches:
      - 1
      predecessors:
      - 1
      kind: MEASURE
  result:
    terminal_status: complete
    event_queue_empty: true
    decode_work_settled: true
    execution_workload_complete: true
    execution_done_ticks: 11000000
    fully_done_ticks: 14250000
    operation_results:
    - operation_id: 0
      result_status: no_logical_output
    - operation_id: 1
      result_status: no_logical_output
    - operation_id: 2
      result_status: no_logical_output
  metric_values:
