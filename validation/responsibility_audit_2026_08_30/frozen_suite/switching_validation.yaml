# The switching validation point: weak pymatching with complementary
# gap, escalating to belief matching below the paper's 20 dB threshold
# (Toshio 2510.25222 Sec. IV). Near-threshold p so escalations and
# logical errors are frequent enough to check in small runs.

extends: weak_decoder_baseline.yaml

mode: switching

switching:
  gap_threshold_db: 20.0

links:
  qc:  {latency_cycles: 1, clock: fridge, bits_per_cycle: null}
  cwb: {latency_cycles: 1, clock: fridge, bits_per_cycle: null}
  csb: {latency_cycles: 1, clock: room, bits_per_cycle: null}
  wbd: {latency_cycles: 1, clock: fridge, bits_per_cycle: null}
  wsd: {latency_cycles: 1, clock: room, bits_per_cycle: null}
  sbd: {latency_cycles: 1, clock: room, bits_per_cycle: null}
  dd:  {latency_cycles: 1, clock: fridge, bits_per_cycle: null}
  wdo: {latency_cycles: 1, clock: fridge, bits_per_cycle: null}
  do:  {latency_cycles: 1, clock: room, bits_per_cycle: null}
  oc:  null
  cq:  null

decoder:
  weak:
    algorithm: pymatching
    units: 1
    unit_buffer_size: null
    engine:
      clock: fridge
      fetch_cycles_per_round: 1
      release_cycles_per_job: 10
  strong:
    algorithm: belief_matching
    units: 1
    unit_buffer_size: null
    engine:
      clock: room
      fetch_cycles_per_round: 1
      release_cycles_per_job: 10

sweep:
  - physical_error_probability: [0.008]
    distance: [3, 5]
    round_period_us: [1.0]
    shots: 50
