    license: MIT
    status: VERIFIED
    files_studied: [swiper/simulator.py, swiper/device_manager.py,
                    swiper/window_manager.py, swiper/window_builder.py,
                    swiper/decoder_manager.py, swiper/lattice_surgery_schedule.py]
